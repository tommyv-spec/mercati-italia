name: One-time static catalog bootstrap (review branch)
on:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/bootstrap-one-time.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-data-bootstrap
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refuse to overwrite existing baseline
        run: |
          if [ -f public/data/v1/manifest.json ]; then
            echo "A baseline already exists; refusing one-time import."
            exit 1
          fi
      - name: Query only matching market categories (READ ONLY)
        run: |
          python backend/source_firestore_public.py --project market-ef407 --max-records 20000 --page-size 500 --output /tmp/current_markets.json
      - name: Checkpoint A - save read-only Firestore export
        uses: actions/upload-artifact@v4
        with:
          name: firestore-markets-review
          path: /tmp/current_markets.json
          retention-days: 7
      - name: Import official municipal weekly markets (READ ONLY)
        run: |
          python backend/source_milano.py --output /tmp/milano_markets.json
      - name: Combine sources, retaining evidence
        run: |
          python backend/merge_catalog.py --new /tmp/current_markets.json --new /tmp/milano_markets.json --out /tmp/all_markets.json
      - name: Checkpoint B - save merged source data
        uses: actions/upload-artifact@v4
        with:
          name: merged-markets-review
          path: /tmp/all_markets.json
          retention-days: 7
      - name: Build first static dataset with strict guards
        run: |
          python backend/export_static.py --input /tmp/all_markets.json --min-count 20
      - name: Validate every published asset and total
        run: |
          python backend/validate_static.py --manifest public/data/v1/manifest.json
      - name: Commit checkpoint to REVIEW BRANCH ONLY
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/v1
          git commit -m "data: bootstrap first guarded static market catalog (review only)"
          git push
