name: Verify public static mobile preview
on:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/check-public-preview.yml

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install mobile test browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test external HTTPS preview as mobile visitor
        env:
          UI_BASE: https://raw.githack.com/tommyv-spec/mercati-italia/dev-static-preview/index.html
        run: node tests/ui-smoke.mjs
      - name: Keep mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-weekly-city-mobile
          path: |
            ux-home.png
            ux-detail.png
            ux-map.png
            ux-weekly-city.png
            ux-weekly-saturday.png
            ux-nearby.png
            ux-smoke-result.json
          retention-days: 7
          if-no-files-found: ignore
