name: One-time catalog UX quality cleanup
on:
  workflow_dispatch:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/cleanup-catalog-once.yml

permissions:
  contents: write

concurrency:
  group: static-data-quality-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Save baseline counts
        run: |
          test -s public/data/v1/manifest.json
          python - <<'PY'
          import json
          data=json.load(open('public/data/v1/manifest.json'))
          print('Previous candidates:', data['total'], 'index:', data.get('index'))
          PY
          tar -czf /tmp/mercati-before-quality-cleanup.tgz public/data/v1
      - name: Upload rollback checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: original-static-dataset
          path: /tmp/mercati-before-quality-cleanup.tgz
          retention-days: 7
      - name: Re-normalize pre-production snapshot, offline
        run: python backend/reprocess_snapshot.py --prune-stale
      - name: Verify all active static assets
        run: python backend/validate_static.py --manifest public/data/v1/manifest.json
      - name: Drop only unreferenced old search indexes before first release
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('public/data/v1')
          m=json.loads((root/'manifest.json').read_text('utf-8'))
          keep=m['index'].split('/')[-1]
          for old in root.glob('index-*.json'):
              if old.name != keep:
                  old.unlink()
          PY
      - name: Commit data cleanup to PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/v1
          if ! git diff --cached --quiet; then
            git commit -m "data: drop historical editions and invalid city names"
            git push
          fi
