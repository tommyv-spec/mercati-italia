# Source expansion remains read-only; only aggregate audit reports are saved to DEV.
name: Mercati source growth audit — row freshness and coverage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/data-expansion-audit.yml
  schedule:
    - cron: '23 06 * * *'
  workflow_dispatch:

concurrency:
  group: mercati-data-expansion-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin DEV and run all regressions
        run: |
          set -euo pipefail
          mkdir -p growth-output
          git rev-parse HEAD > growth-output/dev-source-sha.txt
          python -m unittest discover -s backend/tests -v
      - name: Score regional and local market data gaps
        run: |
          python backend/data_coverage.py \
            --manifest public/data/v1/manifest.json \
            --out growth-output/data-coverage.json \
            --report growth-output/DATA_COVERAGE.md
      - name: Audit real rows of up to three municipal CSVs
        run: |
          python backend/municipal_row_audit.py \
            --previous reports/automation/municipal-row-audit.json \
            --out growth-output/municipal-row-audit.json \
            --report growth-output/MUNICIPAL_ROW_AUDIT.md
      - name: Reject any unreviewed market imports or verification claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          coverage=json.loads(Path('growth-output/data-coverage.json').read_text('utf-8'))
          src=json.loads(Path('growth-output/municipal-row-audit.json').read_text('utf-8'))
          manifest=json.loads(Path('public/data/v1/manifest.json').read_text('utf-8'))
          if (coverage.get('schema')!=1 or coverage.get('review_only') is not True
              or coverage.get('market_updates_applied')!=0
              or coverage.get('market_confirmations_created')!=0
              or coverage.get('market_identities_deleted')!=0
              or coverage.get('source_evidence_replaced')!=0
              or coverage.get('national',{}).get('records')!=manifest.get('total')):
              raise ValueError('Untrusted national coverage report')
          if (src.get('schema')!=1 or src.get('review_only') is not True
              or src.get('imports')!=0 or src.get('verified_events')!=0
              or src.get('sample_limit')!=3 or len(src.get('sources',[]))>3):
              raise ValueError('Source scanner exceeded read-only permission')
          if any(row.get('market_import_permission') is not False
                 or row.get('markets_confirmed')!=0 for row in src.get('sources',[])):
              raise ValueError('Unreviewed new source promoted a market')
          print('SAFE_GROWTH_REVIEW',manifest['total'],'market IDs preserved')
          PY
          cat growth-output/DATA_COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
          cat growth-output/MUNICIPAL_ROW_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save source research and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercati-growth-review
          path: growth-output/
          retention-days: 30
          if-no-files-found: warn

  publish_review:
    name: Save only aggregate quality reports on DEV
    needs: audit
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: mercati-growth-review
          path: growth-output
      - name: Reject stale checkout and commit only reviewed aggregate reports
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat growth-output/dev-source-sha.txt)" = "$(git rev-parse HEAD)"
          mkdir -p reports/automation
          for item in data-coverage.json DATA_COVERAGE.md municipal-row-audit.json MUNICIPAL_ROW_AUDIT.md; do
            test -s "growth-output/$item"
            cp "growth-output/$item" "reports/automation/$item"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/automation/data-coverage.json reports/automation/DATA_COVERAGE.md \
            reports/automation/municipal-row-audit.json reports/automation/MUNICIPAL_ROW_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "audit: rank data gaps and real source freshness (DEV only)"
            git push origin HEAD:improve/data-quality-security-performance-2026-10-11
          fi
          echo 'DEV quality reports updated. No market records added.' >> "$GITHUB_STEP_SUMMARY"
