# Source expansion remains read-only; only aggregate audit reports are saved to DEV.
name: Mercati source growth audit — row freshness and coverage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/data-expansion-audit.yml
  schedule:
    - cron: '23 06 * * *'
  workflow_dispatch:

concurrency:
  # Serialize the catalog publish and the read-only research report writer.
  # Otherwise a new DEV QA snapshot can race an unrelated report commit.
  group: mercati-all-dev-report-and-catalog-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin DEV and run all regressions
        run: |
          set -euo pipefail
          mkdir -p growth-output
          git rev-parse HEAD > growth-output/dev-source-sha.txt
          python -m unittest discover -s backend/tests -v
      - name: Score regional and local market data gaps
        run: |
          python backend/data_coverage.py \
            --manifest public/data/v1/manifest.json \
            --out growth-output/data-coverage.json \
            --report growth-output/DATA_COVERAGE.md
      - name: Measure unrepresented official municipalities without inventing markets
        run: |
          python backend/municipality_coverage.py \
            --manifest public/data/v1/manifest.json \
            --out growth-output/municipality-coverage.json \
            --report growth-output/MUNICIPALITY_COVERAGE.md
      - name: Audit real rows of up to three municipal CSVs
        run: |
          python backend/municipal_row_audit.py \
            --previous reports/automation/municipal-row-audit.json \
            --out growth-output/municipal-row-audit.json \
            --report growth-output/MUNICIPAL_ROW_AUDIT.md
      - name: Measure actual venue yields of vetted sources without importing anything
        run: |
          python backend/source_yield_audit.py \
            --manifest public/data/v1/manifest.json \
            --registry reports/automation/source-registry.json \
            --municipalities growth-output/municipality-coverage.json \
            --probes reports/automation/source-probes.json \
            --live-bologna \
            --out growth-output/source-yield.json \
            --report growth-output/SOURCE_YIELD.md
      - name: Reconcile four recent Bologna municipal leads without importing
        run: |
          python backend/bologna_2026_leads.py \
            --manifest public/data/v1/manifest.json \
            --evidence backend/data/bologna-municipal-leads-2026.json \
            --out growth-output/bologna-2026-leads.json \
            --report growth-output/BOLOGNA_2026_LEADS.md
      - name: Audit Municipio XIII market map against complete catalog without importing
        run: |
          python backend/roma_xiii_map_audit.py \
            --manifest public/data/v1/manifest.json \
            --source backend/data/roma-municipio-xiii-market-map-reviewed.json \
            --out growth-output/roma-xiii-map-audit.json \
            --report growth-output/ROMA_XIII_MAP_AUDIT.md
      - name: Reuse generic source contracts to compare real municipal CSV rows
        run: |
          python backend/source_lifecycle.py \
            --manifest public/data/v1/manifest.json \
            --contracts backend/data/market-source-contracts.json \
            --previous reports/automation/raw-source-lifecycle.json \
            --probe-raw \
            --stage-raw \
            --out growth-output/raw-source-lifecycle.json \
            --report growth-output/RAW_SOURCE_LIFECYCLE.md
      - name: Reject any unreviewed market imports or verification claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          coverage=json.loads(Path('growth-output/data-coverage.json').read_text('utf-8'))
          src=json.loads(Path('growth-output/municipal-row-audit.json').read_text('utf-8'))
          manifest=json.loads(Path('public/data/v1/manifest.json').read_text('utf-8'))
          towns=json.loads(Path('growth-output/municipality-coverage.json').read_text('utf-8'))
          yields=json.loads(Path('growth-output/source-yield.json').read_text('utf-8'))
          recent=json.loads(Path('growth-output/bologna-2026-leads.json').read_text('utf-8'))
          roma=json.loads(Path('growth-output/roma-xiii-map-audit.json').read_text('utf-8'))
          registry=json.loads(Path('reports/automation/source-registry.json').read_text('utf-8'))
          lifecycle=json.loads(Path('growth-output/raw-source-lifecycle.json').read_text('utf-8'))
          if (coverage.get('schema')!=1 or coverage.get('review_only') is not True
              or coverage.get('market_updates_applied')!=0
              or coverage.get('market_confirmations_created')!=0
              or coverage.get('market_identities_deleted')!=0
              or coverage.get('source_evidence_replaced')!=0
              or coverage.get('national',{}).get('records')!=manifest.get('total')):
              raise ValueError('Untrusted national coverage report')
          if (src.get('schema')!=1 or src.get('review_only') is not True
              or src.get('imports')!=0 or src.get('verified_events')!=0
              or src.get('sample_limit')!=3 or len(src.get('sources',[]))>3):
              raise ValueError('Source scanner exceeded read-only permission')
          if (towns.get('schema')!=1 or towns.get('review_only') is not True
              or towns.get('municipalities_total')!=7894
              or towns.get('catalog_entries_added')!=0
              or towns.get('events_confirmed')!=0
              or towns.get('catalog_market_ids_preserved')!=manifest.get('total')
              or towns.get('municipalities_with_catalog_listings',0)
                 + towns.get('municipalities_without_catalog_listings',0)!=7894):
              raise ValueError('Untrusted municipality coverage report')
          if (yields.get('schema')!=1 or yields.get('review_only') is not True
              or yields.get('catalog_market_ids_retained')!=manifest.get('total')
              or yields.get('sources_checked')!=len(registry.get('sources',[]))
              or yields.get('actual_source_samples_checked') not in (0,1)
              or any(yields.get(field)!=0 for field in (
                  'sources_imported','markets_added','markets_deleted',
                  'market_rows_edited','market_events_confirmed',
                  'official_license_verified_automatically'))
              or any(row.get('market_entries_added')!=0
                     or row.get('individual_events_confirmed')!=0
                     for row in yields.get('all_sources',[]))):
              raise ValueError('Source yield auditor exceeded read-only permissions')
          if (recent.get('schema') != 1
              or recent.get('review_only') is not True
              or recent.get('catalog_ids_preserved') != manifest.get('total')
              or recent.get('pinned_municipal_leads') != 4
              or recent.get('planned_market_starts_not_verified') != 2
              or recent.get('historically_reported_open_in_june') != 2
              or not 0 <= recent.get('without_same_street_record',-1) <= 4
              or recent.get('needs_current_opening_and_rights_review') is not True
              or len(recent.get('observations',[])) != 4
              or any(recent.get(field) != 0 for field in (
                  'market_rows_imported','verified_openings_created',
                  'calendar_dates_created','coordinate_points_invented'))):
              raise ValueError('Unreviewed Bologna 2026 press lead promoted to market')
          if any(row.get('catalog_publication_approved') is not False
                 or row.get('market_opening_individually_verified') is not False
                 for row in recent.get('observations', [])):
              raise ValueError('Source press release cannot confirm an individual market opening')
          bologna=yields.get('bologna_observation')
          if (yields.get('location_conflicts_documented') != 1
              or not yields.get('location_conflicts_source_sha256')):
              raise ValueError('Publisher relocation safety evidence is absent')
          if bologna and (bologna.get('independent_relocation_evidence') != 1
              or bologna.get('counts',{}).get('documented_location_conflicts_held',0) > 1):
              raise ValueError('Bologna relocation conflicts were not screened')
          if bologna and (bologna.get('records_imported')!=0
              or bologna.get('events_confirmed')!=0
              or bologna.get('catalog_data_changed') is not False
              or not 1<=bologna.get('counts',{}).get('observed_source_rows',0)<=65):
              raise ValueError('Observed source rows promoted without review')
          if any(row.get('market_import_permission') is not False
                 or row.get('markets_confirmed')!=0 for row in src.get('sources',[])):
              raise ValueError('Unreviewed new source promoted a market')
          if (roma.get('schema') != 1 or roma.get('role') != 'municipal_map_place_matching_only'
              or roma.get('review_only') is not True
              or roma.get('municipal_map_markers') != 9
              or roma.get('original_market_ids_preserved') != manifest.get('total')
              or roma.get('data_license_cleared_automatically') is not False
              or len(roma.get('observations',[])) != 9
              or any(roma.get(field) != 0 for field in (
                  'source_market_ids_published','market_cards_modified',
                  'future_events_confirmed','road_directions_enabled'))
              or any(row.get('automatic_enrichment_allowed') is not False
                     or row.get('source_verified_2026') is not False
                     for row in roma['observations'])):
              raise ValueError('Roma XIII outdated map was promoted to verified current markets')
          if (lifecycle.get('schema')!=1
              or lifecycle.get('source_contract_schema')!=1
              or lifecycle.get('read_only') is not True
              or lifecycle.get('catalog_count')!=manifest['total']
              or not set(lifecycle.get('sources',{})).issubset({'corciano-generic-shadow'})
              or any(lifecycle.get(field)!=0 for field in (
                  'market_imports','market_updates','market_confirmations',
                  'market_identity_deletions'))):
              raise ValueError('Source-level generic parser exceeded its read-only scope')
          if lifecycle.get('source_checks',{}).get('raw_schema_or_identity_change_requires_review',0):
              raise ValueError('Publisher CSV format or identity meaning changed: update source contract after reviewing official distribution')
          for row in lifecycle.get('sources',{}).values():
              if row.get('catalog_records_imported',0)!=0 or row.get('individual_market_openings_verified',0)!=0:
                  raise ValueError('Schema probe falsely confirmed a market opening')
              if row.get('source_snapshot_sha256'):
                  staged=row.get('source_stage')
                  counts=row.get('counts',{})
                  if (not isinstance(staged,dict)
                      or staged.get('source_snapshot_sha256')!=row['source_snapshot_sha256']
                      or staged.get('verified_openings_created')!=0
                      or staged.get('existing_market_identities_deleted')!=0
                      or staged.get('precise_coordinates_created')!=0
                      or staged.get('publication_enabled') is not False):
                      raise ValueError('Fresh municipal source has no auditable safe generic staging')
                  categories=staged.get('counts',{})
                  rejected=sum((staged.get('review_reason_counts') or {}).values())
                  if (categories.get('raw_rows_scanned')!=counts.get('rows_observed')
                      or categories.get('source_market_identities',0)+
                         staged.get('review_reason_counts',{}).get('duplicate_publisher_identity',0)
                         > counts.get('rows_observed',0)
                      or staged.get('safe_candidates_not_published',0)
                         >categories.get('source_market_identities',0)):
                      raise ValueError('Staging summary does not reconcile with full publisher CSV')
          print('SAFE_GROWTH_REVIEW',manifest['total'],'market IDs preserved')
          PY
          cat growth-output/DATA_COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
          cat growth-output/MUNICIPALITY_COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
          cat growth-output/MUNICIPAL_ROW_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          cat growth-output/SOURCE_YIELD.md >> "$GITHUB_STEP_SUMMARY"
          cat growth-output/BOLOGNA_2026_LEADS.md >> "$GITHUB_STEP_SUMMARY"
          cat growth-output/ROMA_XIII_MAP_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          cat growth-output/RAW_SOURCE_LIFECYCLE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save source research and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercati-growth-review
          path: growth-output/
          retention-days: 30
          if-no-files-found: warn

  publish_review:
    name: Save only aggregate quality reports on DEV
    needs: audit
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: mercati-growth-review
          path: growth-output
      - name: Reject stale checkout and commit only reviewed aggregate reports
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat growth-output/dev-source-sha.txt)" = "$(git rev-parse HEAD)"
          mkdir -p reports/automation
          for item in data-coverage.json DATA_COVERAGE.md municipal-row-audit.json MUNICIPAL_ROW_AUDIT.md municipality-coverage.json MUNICIPALITY_COVERAGE.md source-yield.json SOURCE_YIELD.md bologna-2026-leads.json BOLOGNA_2026_LEADS.md roma-xiii-map-audit.json ROMA_XIII_MAP_AUDIT.md raw-source-lifecycle.json RAW_SOURCE_LIFECYCLE.md; do
            test -s "growth-output/$item"
            cp "growth-output/$item" "reports/automation/$item"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/automation/data-coverage.json reports/automation/DATA_COVERAGE.md \
            reports/automation/municipal-row-audit.json reports/automation/MUNICIPAL_ROW_AUDIT.md \
            reports/automation/municipality-coverage.json reports/automation/MUNICIPALITY_COVERAGE.md \
            reports/automation/source-yield.json reports/automation/SOURCE_YIELD.md \
            reports/automation/bologna-2026-leads.json reports/automation/BOLOGNA_2026_LEADS.md \
            reports/automation/roma-xiii-map-audit.json reports/automation/ROMA_XIII_MAP_AUDIT.md \
            reports/automation/raw-source-lifecycle.json reports/automation/RAW_SOURCE_LIFECYCLE.md
          if ! git diff --cached --quiet; then
            git commit -m "audit: rank data gaps and real source freshness (DEV only)"
            git push origin HEAD:improve/data-quality-security-performance-2026-10-11
          fi
          echo 'DEV quality reports updated. No market records added.' >> "$GITHUB_STEP_SUMMARY"
