# MapLibre v6 production blocker regression: verify bundled worker and browser-ready map before any DEV promotion.
# Recheck 75 municipality PDF/GIS-backed Milan street labels on DEV; no production release.
# Replay Oct 18: evaluate approved source-pinned Milan streets on DEV after all release QA.
# Shared source-level CSV/JSON admission is now registered: approve an official dataset once, not each market. Default-deny empty legal registry, exact identity/rights proofs, offline fallback, no fake GPS/opening claims; DEV only.
# Source lifecycle verifies exact in-memory source-ID exclusion partitions, not just coincidental counts. All uncertain additions stay in review; no per-market scripts.
# Roma Municipio XIII five source-reviewed 2026 market identities: every daily
# replay must preserve all five IDs, forecast labels, original source URLs,
# and suspended directions without adding duplicates or verifying openings.
# Source-pinned Todi seasonal forecast, Collalto/Susegana and Veneto point holds:
# persist full independent publisher evidence after mobile QA; DEV only.
# Idempotence replay for ISTAT town corrections after approved DEV release 38258577545.
# Expected: zero new town corrections and zero repeated calendar suspensions.
# Source-pinned ISTAT municipality correction passed read-only national + mobile
# rehearsal 38257567252; only approved city/title and forecast quarantine
# edits may reach DEV. Never update production or human verification claims.
# Search regression 2026-10-12: implicit seven-day default must not hide
# undated markets found by name; explicit day filter remains authoritative.
# Verified Playwright mobile run 38237681447; publish only after all CI gates.
# Real-source enrichment idempotence + diversified source probing approved CI replay.
# Each previously filled hour and source URL must be preserved without duplicate evidence.
# Corciano idempotence replay: after first DEV import 38188711597,
# require the second audited run to preserve exactly the same official IDs.
# Corciano 4-row official CSV passed complete source+browser dry-run
# (run 38188219950); only reviewed, non-overlapping IDs may enter DEV.
# CSV SHA-256 is persisted and monitored for future changes; no false confirmations.
# Lombardia MERCap has passed a full read-only integration and browser audit.
# Only this scheduled workflow may publish the screened official source to DEV.
# Re-runnable methodology: docs/RUNBOOK_DATA_FRESHNESS.md
# Source data freshness is measured separately from workflow completion time.
# Only trusted SCHEDULER lives on main. All implementation, data snapshots and
# publication remain isolated in the DEV branch. No Cloudflare Worker/KV/D1
# or Firebase call occurs when a visitor browses the static preview.
name: Mercati Autopilot — scheduled DEV improvements
run-name: DEV catalog • ${{ github.event_name }} • #${{ github.run_number }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market-autopilot.yml
  schedule:
    - cron: '17 04 * * *'
  workflow_dispatch:
    inputs:
      offline:
        type: boolean
        required: false
        default: false
        description: 'Use existing sources only; no external official feed download'

concurrency:
  # Serialize the catalog publish and the read-only research report writer.
  # Otherwise a new DEV QA snapshot can race an unrelated report commit.
  group: mercati-all-dev-report-and-catalog-writes
  cancel-in-progress: false

env:
  DEV_BRANCH: improve/data-quality-security-performance-2026-10-11
  CHECKPOINT_NAME: mercati-checkpoints-${{ github.run_id }}
  BUILD_NAME: mercati-qa-build-${{ github.run_id }}

jobs:
  candidate:
    name: Source → merge → recurrence → export → quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV_BRANCH }}
          persist-credentials: false
      - name: Pin the DEV source revision before collecting evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p autopilot-output
          git rev-parse HEAD > autopilot-output/dev-source-sha.txt
          echo "Pinned DEV revision: $(cat autopilot-output/dev-source-sha.txt)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source adapters and all trusted automation rules
        run: python -m unittest discover -s backend/tests -v
      - name: Run fail-closed Autopilot with checkpoint persistence
        env:
          AUTOPILOT_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$AUTOPILOT_OFFLINE" == "true" ]]; then args+=(--offline); fi
          python backend/autopilot.py --output autopilot-output "${args[@]}"
      - name: Rank improvement opportunities from measured data
        if: success()
        run: |
          python backend/autopilot_feedback.py \
            --manifest autopilot-output/candidate/public/data/v1/manifest.json \
            --out autopilot-output/roadmap.json
          cat autopilot-output/roadmap.md >> "$GITHUB_STEP_SUMMARY"
      - name: Study every incomplete market and correlate already-reviewed official feeds
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          current_date="$(python -c 'import json; print(json.load(open("autopilot-output/release-decision.json"))["today"])')"
          args=(
            --manifest autopilot-output/candidate/public/data/v1/manifest.json
            --contracts backend/data/market-evidence-source-families.json
            --today "$current_date"
            --out autopilot-output/market-evidence-worklist.json
            --summary autopilot-output/market-evidence-summary.json
            --report autopilot-output/MARKET_EVIDENCE_WORKLIST.md
          )
          if [[ -s autopilot-output/sources/lombardia.json ]]; then
            args+=(--official-lombardia autopilot-output/sources/lombardia.json)
          fi
          python backend/market_evidence_worklist.py "${args[@]}"
          cat autopilot-output/MARKET_EVIDENCE_WORKLIST.md >> "$GITHUB_STEP_SUMMARY"
      - name: Discover new municipal structured sources (read-only, no auto-import)
        if: success()
        env:
          AUTOPILOT_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AUTOPILOT_OFFLINE" == "true" ]]; then
            python backend/source_scout.py --offline --out autopilot-output/official-candidates.json
          else
            python backend/source_scout.py --out autopilot-output/official-candidates.json || {
              echo "::warning::Source discovery offline; keep last approved source adapters."
            }
          fi
      - name: Build provisional bounded source registry (no publication)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python backend/source_intake.py \
            --scout autopilot-output/official-candidates.json \
            --previous reports/automation/source-registry.json \
            --publisher-evidence autopilot-output/publisher-not-collected-yet.json \
            --out autopilot-output/source-registry.json \
            --report autopilot-output/SOURCE_QUEUE.md
      - name: Recheck official publisher metadata and license claims (no import)
        if: success()
        env:
          AUTOPILOT_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$AUTOPILOT_OFFLINE" == "true" ]]; then args+=(--offline); fi
          python backend/source_evidence.py \
            --registry autopilot-output/source-registry.json \
            --out autopilot-output/source-evidence.json \
            --report autopilot-output/SOURCE_EVIDENCE.md \
            "${args[@]}"
          cat autopilot-output/SOURCE_EVIDENCE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Rank source intake from official publisher dates in same run
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python backend/source_intake.py \
            --scout autopilot-output/official-candidates.json \
            --previous reports/automation/source-registry.json \
            --publisher-evidence autopilot-output/source-evidence.json \
            --out autopilot-output/source-registry.json \
            --report autopilot-output/SOURCE_QUEUE.md
          cat autopilot-output/SOURCE_QUEUE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Sample up to three official source schemas in a bounded read-only sandbox
        if: success()
        env:
          AUTOPILOT_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$AUTOPILOT_OFFLINE" == "true" ]]; then args+=(--offline); fi
          python backend/source_probe.py \
            --registry autopilot-output/source-registry.json \
            --out autopilot-output/source-probes.json \
            --report autopilot-output/SOURCE_SCHEMA.md \
            "${args[@]}"
          cat autopilot-output/SOURCE_SCHEMA.md >> "$GITHUB_STEP_SUMMARY"
      - name: Re-rank candidate publishers with observed bounded schema evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python backend/source_intake.py \
            --scout autopilot-output/official-candidates.json \
            --previous reports/automation/source-registry.json \
            --publisher-evidence autopilot-output/source-evidence.json \
            --schema-evidence autopilot-output/source-probes.json \
            --out autopilot-output/source-registry.json \
            --report autopilot-output/SOURCE_QUEUE.md
          cat autopilot-output/SOURCE_QUEUE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare declared source changes to previous scheduled run
        if: success()
        run: |
          python backend/source_change_detector.py \
            --current autopilot-output/source-evidence.json \
            --previous reports/automation/source-evidence.json \
            --corciano-current autopilot-output/corciano-overlaps.json \
            --corciano-previous reports/automation/corciano-overlaps.json \
            --out autopilot-output/source-changes.json \
            --report autopilot-output/SOURCE_CHANGES.md
          cat autopilot-output/SOURCE_CHANGES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit real source age, projected dates and documented verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          max_age="$(python -c 'import json; print(json.load(open("backend/autopilot_policy.json"))["forecast"]["max_source_age_days"])')"
          python backend/freshness_monitor.py \
            --manifest autopilot-output/candidate/public/data/v1/manifest.json \
            --publisher-evidence autopilot-output/source-evidence.json \
            --out autopilot-output/freshness.json \
            --report autopilot-output/FRESHNESS.md \
            --max-source-age-days "$max_age"
          python backend/freshness_alert.py \
            --freshness autopilot-output/freshness.json \
            --source-changes autopilot-output/source-changes.json \
            --out autopilot-output/freshness-alert.json
          cat autopilot-output/FRESHNESS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit nationwide future-date labels, suspect cities and venue/day overlaps
        if: success()
        run: |
          set -euo pipefail
          python backend/catalog_quality_report.py \
            --manifest autopilot-output/candidate/public/data/v1/manifest.json \
            --previous reports/automation/catalog-quality.json \
            --out autopilot-output/catalog-quality.json \
            --report autopilot-output/CATALOG_QUALITY.md
          cat autopilot-output/CATALOG_QUALITY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve checkpoints and candidate even after failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: autopilot-output/
          retention-days: 30
          if-no-files-found: warn

  qa:
    name: Security, compiled static site, mobile browser checks
    needs: candidate
    if: needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV_BRANCH }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: autopilot-output
      - name: Reject QA on a different DEV code revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat autopilot-output/dev-source-sha.txt)"
      - name: Assert newly discovered sources have no automatic import permission
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          info = json.loads(Path('autopilot-output/source-registry.json').read_text())
          if info['record_imports'] != 0 or info['source_licenses_verified_by_automation'] != 0:
              raise ValueError('Source discovery must not import or verify records')
          if any(item['automatic_import_allowed'] for item in info['sources']):
              raise ValueError('Unreviewed dataset granted import permissions')
          print('Metadata-only intake safety check passed.')
          PY
      - name: Reject any source schema preview that grants import authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          probes = json.loads(Path('autopilot-output/source-probes.json').read_text())
          if probes.get('imports') != 0 or probes.get('verified_event_count') != 0:
              raise ValueError('Source schema probing cannot verify or publish markets')
          if len(probes.get('reports', [])) > 3:
              raise ValueError('Sample rate limit exceeded')
          if len(probes.get('probe_history', {})) > 400:
              raise ValueError('Unbounded historical municipal schema probes')
          if probes.get('max_requests') != 3:
              raise ValueError('Official source probing request budget changed')
          registry = json.loads(Path('autopilot-output/source-registry.json').read_text())
          known = probes.get('probe_history', {})
          for src in registry['sources']:
              observed = src.get('schema_viability')
              if observed is not None and (
                  src['id'] not in known or known[src['id']].get('viability') != observed
              ):
                  raise ValueError('Unsubstantiated schema quality claim in source ranking')
          if any(r.get('adapter_enabled') or r.get('source_license_verified')
                 or r.get('events_confirmed') for r in probes['reports']):
              raise ValueError('Schema preview made an unauthorized approval')
          print('Official source schema previews remain quarantine-only.')
          PY
      - name: Reject false inferred market identities and unknown-coordinate labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          probes = json.loads(Path('autopilot-output/source-probes.json').read_text())
          name_false_friends = {'tipologia_mercato', 'nome_quartiere', 'nome_zona',
                                'note_mercato', 'anno_istituzione_mercato'}
          for item in probes['reports']:
              hints = item.get('field_hints', {})
              values = {name.casefold() for name in hints.get('name', [])}
              if values & name_false_friends:
                  raise ValueError('False market-name inference in official data: ' + item['id'])
              coordinates = {name.casefold() for key in ('latitude', 'longitude')
                             for name in hints.get(key, [])}
              if coordinates & {'geo_x', 'geo_y'}:
                  raise ValueError('Coordinates without verified CRS were treated as degrees')
              if item.get('status') == 'schema_preview_only' and not item.get('fields'):
                  raise ValueError('Empty schema was accepted')
          print('Market identity and coordinate inference remained conservative.')
          PY
      - name: Verify reusable publisher contracts stay read-only and source-level
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'backend')
          from source_lifecycle import validate_contracts,digest
          root=Path('autopilot-output')
          policy=json.loads(Path('backend/autopilot_policy.json').read_text('utf-8'))
          lifecycle=json.loads((root/'source-lifecycle.json').read_text('utf-8'))
          config=validate_contracts(json.loads(Path('backend/data/market-source-contracts.json').read_text('utf-8')))
          original=json.loads(Path('public/data/v1/manifest.json').read_text('utf-8'))
          expected={p['id'] for p in config['normalized_profiles']}
          if (lifecycle.get('schema')!=1
              or lifecycle.get('source_contract_schema')!=1
              or lifecycle.get('read_only') is not True
              or lifecycle.get('catalog_count')!=original['total']
              or any(lifecycle.get(field)!=0 for field in (
                  'market_imports','market_updates','market_confirmations',
                  'market_identity_deletions'))):
              raise ValueError('Generic publisher source inspection modified market identities')
          if policy.get('source_lifecycle',{}).get('enabled') is True:
              if (lifecycle.get('registry_sha256')!=digest(config)
                  or not set(lifecycle.get('sources',{})).issubset(expected)
                  or lifecycle.get('checked_source_profiles') != len(lifecycle['sources'])):
                  raise ValueError('Unknown source contract or unreviewed publisher identity')
              for sid,source in lifecycle['sources'].items():
                  if (source.get('schema')!=1 or
                      source.get('source_id')!=sid or
                      source.get('catalog_records_compared')!=original['total'] or
                      source.get('confirmed_events_created')!=0 or
                      source.get('market_records_imported')!=0 or
                      source.get('market_records_edited')!=0 or
                      source.get('market_ids_deleted')!=0):
                      raise ValueError('Generic source audit falsely approved a market: '+sid)
          # Reuse the SAME exact source identities vetted by the source
          # overlap gate. Two matching numerical counts are not evidence that
          # the same records were excluded; only the complete partition is.
          source_status=json.loads((root/'release-decision.json').read_text('utf-8')).get('sources',{})
          for sid in ('lombardia','corciano','bologna'):
              upstream=source_status.get(sid) or {}
              if upstream.get('status') not in ('retrieved','resumed_checkpoint'):
                  continue
              entry=(lifecycle.get('sources') or {}).get(sid)
              if not entry:
                  raise ValueError('Reviewed source cohort lacks lifecycle proof: '+sid)
              counts=entry.get('counts') or {}
              screened=entry.get('source_screening') or {}
              outside=counts.get('source_ids_not_yet_in_catalog',0)
              reviewed=upstream.get('quarantined_review',0)
              accepted=upstream.get('accepted_after_overlap_qa')
              if (screened.get('exact_reviewed_id_partition_verified') is not True
                  or screened.get('already_quarantined_by_venue_overlap_review')!=reviewed
                  or screened.get('outside_catalog_source_ids_not_necessarily_new_markets')!=outside
                  or screened.get('remaining_identities_without_overlap_disposition')!=outside-reviewed
                  or accepted+reviewed!=counts.get('source_records_scanned')
                  or len(screened.get('quarantine_source_id_set_sha256',''))!=64
                  or screened.get('screening_missing_exact_source_id_proof') is not False):
                  raise ValueError('Publisher venue hold only matched count, not exact source IDs: '+sid)
          print('DECLARATIVE_SOURCE_CONTRACTS',json.dumps({
              'publisher_sources_checked':lifecycle.get('checked_source_profiles',0),
              'catalog_market_ids_unchanged':original['total'],
              'new_events_or_markets_claimed':0
          }))
          PY
      - name: Block unreviewed Lombardia overlap promotions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path('autopilot-output/lombardia-overlaps.json').read_text())
          if (report.get('schema') != 1 or report.get('market_confirmations') != 0
                  or report.get('deleted_existing_records') != 0):
              raise ValueError('Lombardia dedup attempted to delete or verify records')
          if (report['accepted'] + report['quarantined'] != report['source_total']):
              raise ValueError('Overlap quarantine report omits official rows')
          if report['quarantined'] > 500:
              raise ValueError('Too many overlaps for unattended import')
          print('Lombardia reviewed:', report['accepted'],
                'quarantined:', report['quarantined'])
          PY
      - name: Reject unsafe Bologna source overlaps or unapproved publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('autopilot-output/bologna-overlaps.json').read_text())
          decision = json.loads(Path('autopilot-output/release-decision.json').read_text())
          if report.get('schema') != 1 or report.get('region') not in (None,'Emilia-Romagna'):
              raise ValueError('Bologna overlap report malformed')
          if (report.get('accepted',0) + report.get('quarantined',0)
                  != report.get('source_total',0)
                  or report.get('market_confirmations',0) != 0
                  or report.get('deleted_existing_records',0) != 0):
              raise ValueError('Bologna source review cannot erase or verify records')
          if report.get('quarantined',0) > 48:
              raise ValueError('Bologna source conflicts exceed safe limit')
          bologna = decision.get('sources',{}).get('bologna')
          if bologna and bologna.get('status') in ('retrieved','resumed_checkpoint'):
              evidence = json.loads(Path('autopilot-output/source-evidence.json').read_text())
              item = next((x for x in evidence['source_evidence']
                           if x['publisher'] == 'Comune di Bologna'), None)
              if not item or item['status'] != 'metadata_checked':
                  raise ValueError('Bologna source not independently checked')
          print('Bologna quarantined source records:', report['quarantined'])
          PY
      - name: Prevent unreviewed Corciano identity, coordinate and timestamp promotions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          overlap=json.loads(Path('autopilot-output/corciano-overlaps.json').read_text())
          decision=json.loads(Path('autopilot-output/release-decision.json').read_text())
          if (overlap.get('schema') != 1
                  or overlap.get('region') != 'Umbria'
                  or overlap.get('source_prefix') != 'pg-corciano-'
                  or overlap.get('market_confirmations') != 0
                  or overlap.get('deleted_existing_records') != 0):
              raise ValueError('Corciano source review contract violated')
          if (overlap.get('accepted',0) + overlap.get('quarantined',0)
                  != overlap.get('source_total',0)):
              raise ValueError('Incomplete Corciano source reconciliation')
          if overlap.get('quarantined',0) > 8:
              raise ValueError('Corciano source overlap count outside bounds')
          if overlap.get('source_total',0):
              sha=overlap.get('source_csv_sha256')
              if not isinstance(sha,str) or not re.fullmatch('[0-9a-f]{64}',sha):
                  raise ValueError('Corciano source fingerprint missing')
          print('Corciano: reviewed source', overlap.get('source_total',0),
                'accepted',overlap.get('accepted',0),
                'quarantined',overlap.get('quarantined',0))
          PY
      - name: Gate ISTAT municipality corrections against the original complete catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0,'backend')
          from municipality_release_guard import check
          root=Path('autopilot-output')
          details=json.loads((root/'municipality-reconciliation.json').read_text('utf-8'))
          earlier=json.loads((root/'municipality-release-guard.json').read_text('utf-8'))
          if (details.get('schema')!=1 or
                  details.get('source_file_sha256')!='83842076860450f7e482daecea6b7a769f5f93d0bf5b0d48802b44896d7a26d5' or
                  details.get('market_confirmations_created')!=0 or
                  details.get('verified_dates_created')!=0 or
                  details.get('coordinates_changed')!=0 or
                  details.get('publisher_sources_replaced')!=0 or
                  details.get('ids_preserved') is not True):
              raise ValueError('Municipal ISTAT release not properly source-bound')
          if details.get('enabled'):
              a=json.loads((root/'intermediate/merged.json').read_text('utf-8'))
              b=json.loads((root/'intermediate/municipalities.json').read_text('utf-8'))
              actual=check(a,b,details)
              if actual!=earlier:
                  raise ValueError('ISTAT field-level release certificate does not match source changes')
          else:
              if earlier.get('changes')!=0:
                  raise ValueError('Disabled ISTAT cannot change market records')
          print('ISTAT protected markets:', earlier['checked_ids'],
                'city fixes:', earlier['city_replacements'],
                'quarantined calendars:', earlier['calendar_sources_quarantined'],
                'unverified forecasts removed:', earlier['forecast_dates_removed'])
          PY
      - name: Verify source-reviewed municipality and geolocation holds for EVERY edited record
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'backend')
          from reviewed_city_evidence import verify_reviewed_diff, validate_evidence, manifest_id, NAVIGATION_HOLD
          root=Path('autopilot-output')
          policy=json.loads(Path('backend/autopilot_policy.json').read_text('utf-8'))
          report=json.loads((root/'reviewed-cities.json').read_text('utf-8'))
          certificate=json.loads((root/'reviewed-cities-release-guard.json').read_text('utf-8'))
          enabled=policy.get('reviewed_source_cities',{}).get('enabled') is True
          if report.get('enabled') != enabled:
              raise ValueError('Manual publisher review policy/report mismatch')
          if enabled:
              official=json.loads(Path('backend/data/istat-comuni-2026.json').read_text('utf-8'))
              evidence=json.loads(Path('backend/data/reviewed-city-evidence-2026-10-12.json').read_text('utf-8'))
              if manifest_id(evidence) != policy['reviewed_source_cities']['evidence_sha256']:
                  raise ValueError('Reviewed publisher evidence changed from approved fingerprint')
              approved=validate_evidence(evidence,official)
              if len(approved)!=16:
                  raise ValueError('Unexpected manually reviewed publisher case count')
              before=json.loads((root/'intermediate/municipalities.json').read_text('utf-8'))
              after=json.loads((root/'intermediate/reviewed-cities.json').read_text('utf-8'))
              replay=verify_reviewed_diff(before,after,report,official,evidence)
              if replay != certificate:
