            --manifest public/data/v1/manifest.json \
            --out autopilot-output/reversible-display-duplicates.json \
            --report autopilot-output/REVERSIBLE_DISPLAY_DUPLICATES.md
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const current=JSON.parse(fs.readFileSync('autopilot-output/reversible-display-duplicates.json','utf8'))
          const catalog=JSON.parse(fs.readFileSync('autopilot-output/catalog-quality.json','utf8'))
          const oldPath='reports/automation/reversible-display-duplicates.json'
          const prior=fs.existsSync(oldPath) ? JSON.parse(fs.readFileSync(oldPath,'utf8')) : null
          const m=current.metrics
          if (current.schema !== 1 || current.review_only !== true ||
              current.display_grouping_only !== true || current.market_data_modified !== false ||
              m.original_records !== catalog.metrics.total ||
              m.ids_retained !== catalog.metrics.total ||
              m.malformed_source_city_labels_guarded_in_ui !== catalog.metrics.suspicious_city ||
              m.market_identities_deleted !== 0 ||
              m.event_confirmations_created !== 0 ||
              m.verification_claims_created !== 0 ||
              m.suppressed_repeat_buttons_only > m.original_records_in_reversible_groups) {
            throw new Error('Visitor grouping or bad-city protection contradicts the source quality audit')
          }
          if (prior?.metrics) {
            if (m.malformed_source_city_labels_guarded_in_ui >
                prior.metrics.malformed_source_city_labels_guarded_in_ui + 10) {
              throw new Error('Sudden rise in malformed city labels; manual source review required')
            }
            if (m.suppressed_repeat_buttons_only >
                Math.max(50,Math.floor(prior.metrics.suppressed_repeat_buttons_only * 1.35))) {
              throw new Error('Sudden rise in display duplicates; manual source review required')
            }
          }
          console.log('DAILY_VISITOR_QUALITY',JSON.stringify(m))
          NODE
      - name: Prove ordinary Cloudflare catalog visits avoid Functions
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const routes = JSON.parse(fs.readFileSync('dist/_routes.json', 'utf8'))
          if (routes.include.some(x => x === '/*' || x === '/') ||
              !routes.exclude.includes('/data/*')) {
            throw new Error('Cloudflare Functions could intercept normal market visits')
          }
          console.log('Static catalog and page routing verified')
          NODE
      - name: Install mobile browser for end-to-end smoke
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start locally built static site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mercati-autopilot-preview.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/mercati-autopilot-preview.log
          exit 1
      - name: Exercise real user flows — no billed backend calls
        env:
          UI_BASE: http://127.0.0.1:4173/
        run: node tests/ui-smoke.mjs
      - name: Verify blocked directions remain blocked in mobile detail view
        env:
          UI_BASE: http://127.0.0.1:4173/
        run: |
          if python -c 'import json,sys;sys.exit(0 if json.load(open("backend/autopilot_policy.json")).get("reviewed_source_cities",{}).get("enabled") else 1)'; then
            node tests/reviewed-city-ui.mjs
          else
            echo 'Manual source-city overlay disabled; dedicated mobile route check skipped.'
          fi
      - name: Check Rome XIII blocked directions in real lazy-loaded mobile details
        env:
          UI_BASE: http://127.0.0.1:4173/
        run: |
          if python -c 'import json,sys;sys.exit(0 if json.load(open("backend/autopilot_policy.json")).get("roma_xiii_coordinate_holds",{}).get("enabled") else 1)'; then
            node tests/roma-xiii-geo-hold-ui.mjs
          else
            echo 'Roma XIII source hold disabled; no new routes or coordinates permitted.'
          fi
      - name: Verify all five Roma 2026 source-backed market cards on mobile
        env:
          UI_BASE: http://127.0.0.1:4173/
        run: |
          if python -c 'import json,sys;sys.exit(0 if json.load(open("backend/autopilot_policy.json")).get("roma_xiii_2026_venues",{}).get("enabled") else 1)'; then
            node tests/roma-xiii-2026-venues-ui.mjs
          else
            echo 'Roma XIII new official markets disabled, leaving DEV catalog unchanged.'
          fi
      - name: Retain tested visitor duplicate and localities report
        uses: actions/upload-artifact@v4
        with:
          name: mercati-visitor-quality-${{ github.run_id }}
          path: |
            autopilot-output/reversible-display-duplicates.json
            autopilot-output/REVERSIBLE_DISPLAY_DUPLICATES.md
            autopilot-output/reviewed-city-static-safety.json
            autopilot-output/publisher-exception-review.json
            autopilot-output/publisher-exception-diff-guard.json
            autopilot-output/publisher-exception-static-safety.json
            autopilot-output/roma-xiii-geo-holds.json
            autopilot-output/roma-xiii-diff-guard.json
            autopilot-output/roma-xiii-static-guard.json
            autopilot-output/roma-xiii-2026-venues.json
            autopilot-output/roma-xiii-2026-venues-diff-guard.json
            autopilot-output/roma-xiii-2026-venues-static-guard.json
            autopilot-output/generic-source-admissions.json
            autopilot-output/generic-source-admissions-diff-guard.json
            autopilot-output/generic-source-admissions-static-guard.json
          retention-days: 30
          if-no-files-found: error
      - name: Save tested static distribution (for separate DEV publication)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Save mobile QA and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercati-autopilot-mobile-${{ github.run_id }}
          path: |
            ux-*.png
            ux-smoke-result.json
            /tmp/mercati-autopilot-preview.log
          retention-days: 30
          if-no-files-found: warn

  publish_dev:
    name: Update DEV catalog + separately hosted static preview
    needs: [candidate, qa]
    if: needs.candidate.result == 'success' && needs.qa.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV_BRANCH }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: autopilot-output
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: autopilot-built-site
      - uses: actions/download-artifact@v4
        with:
          name: mercati-visitor-quality-${{ github.run_id }}
          path: autopilot-output
      - name: Refuse publication if DEV moved after candidate build
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat autopilot-output/dev-source-sha.txt)"
          test "$(git rev-parse HEAD)" = "$expected"
          git fetch origin "$DEV_BRANCH"
          test "$(git rev-parse "origin/$DEV_BRANCH")" = "$expected"
      - name: Prevent overwriting newer DEV catalog changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$DEV_BRANCH"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report = json.loads(Path('autopilot-output/release-decision.json').read_text())
          if not report.get('approved'):
              raise ValueError('Autopilot policy did not approve this candidate')
          actual = subprocess.check_output(
              ['git', 'show', 'origin/' + subprocess.check_output(
                  ['git', 'branch', '--show-current'], text=True).strip()
               + ':public/data/v1/manifest.json'], text=True)
          current = json.loads(actual)
          if current['content_signature'] != report['base_signature']:
              raise ValueError('DEV market catalog changed after QA: refusing stale overwrite')
          target = Path('autopilot-output/candidate/public/data/v1/manifest.json')
          if not target.is_file() or json.loads(target.read_text())['content_signature'] != report['new_signature']:
              raise ValueError('Candidate artifact signature mismatch')
          PY
      - name: Stage QA-approved source discovery history for DEV only
        shell: bash
        run: |
          set -euo pipefail
          test -s autopilot-output/source-registry.json
          test -s autopilot-output/SOURCE_QUEUE.md
          mkdir -p reports/automation
          cp autopilot-output/source-registry.json reports/automation/source-registry.json
          cp autopilot-output/SOURCE_QUEUE.md reports/automation/SOURCE_QUEUE.md
          test -s autopilot-output/source-probes.json
          test -s autopilot-output/SOURCE_SCHEMA.md
          cp autopilot-output/source-probes.json reports/automation/source-probes.json
          cp autopilot-output/SOURCE_SCHEMA.md reports/automation/SOURCE_SCHEMA.md
          for item in source-evidence.json SOURCE_EVIDENCE.md source-changes.json SOURCE_CHANGES.md freshness.json FRESHNESS.md freshness-alert.json source-lifecycle.json SOURCE_LIFECYCLE.md; do
            test -s "autopilot-output/$item"
            cp "autopilot-output/$item" "reports/automation/$item"
          done
          test -s autopilot-output/lombardia-overlaps.json
          test -s autopilot-output/LOMBARDIA_OVERLAPS.md
          cp autopilot-output/lombardia-overlaps.json reports/automation/lombardia-overlaps.json
          cp autopilot-output/LOMBARDIA_OVERLAPS.md reports/automation/LOMBARDIA_OVERLAPS.md
          test -s autopilot-output/bologna-overlaps.json
          test -s autopilot-output/BOLOGNA_OVERLAPS.md
          cp autopilot-output/bologna-overlaps.json reports/automation/bologna-overlaps.json
          cp autopilot-output/BOLOGNA_OVERLAPS.md reports/automation/BOLOGNA_OVERLAPS.md
          test -s autopilot-output/corciano-overlaps.json
          test -s autopilot-output/CORCIANO_OVERLAPS.md
          cp autopilot-output/corciano-overlaps.json reports/automation/corciano-overlaps.json
          cp autopilot-output/CORCIANO_OVERLAPS.md reports/automation/CORCIANO_OVERLAPS.md
          test -s autopilot-output/official-enrichment.json
          test -s autopilot-output/OFFICIAL_ENRICHMENT.md
          cp autopilot-output/official-enrichment.json reports/automation/official-enrichment.json
          cp autopilot-output/OFFICIAL_ENRICHMENT.md reports/automation/OFFICIAL_ENRICHMENT.md
          test -s autopilot-output/catalog-quality.json
          test -s autopilot-output/CATALOG_QUALITY.md
          cp autopilot-output/catalog-quality.json reports/automation/catalog-quality.json
          cp autopilot-output/CATALOG_QUALITY.md reports/automation/CATALOG_QUALITY.md
          test -s autopilot-output/reversible-display-duplicates.json
          test -s autopilot-output/REVERSIBLE_DISPLAY_DUPLICATES.md
          cp autopilot-output/reversible-display-duplicates.json reports/automation/reversible-display-duplicates.json
          cp autopilot-output/REVERSIBLE_DISPLAY_DUPLICATES.md reports/automation/REVERSIBLE_DISPLAY_DUPLICATES.md
          test -s autopilot-output/municipality-reconciliation.json
          test -s autopilot-output/MUNICIPALITY_RECONCILIATION.md
          test -s autopilot-output/municipality-release-guard.json
          cp autopilot-output/municipality-reconciliation.json reports/automation/municipality-reconciliation.json
          cp autopilot-output/MUNICIPALITY_RECONCILIATION.md reports/automation/MUNICIPALITY_RECONCILIATION.md
          cp autopilot-output/municipality-release-guard.json reports/automation/municipality-release-guard.json
          test -s autopilot-output/reviewed-cities.json
          test -s autopilot-output/reviewed-cities-release-guard.json
          cp autopilot-output/reviewed-cities.json reports/automation/reviewed-cities.json
          cp autopilot-output/reviewed-cities-release-guard.json reports/automation/reviewed-cities-release-guard.json
          test -s autopilot-output/reviewed-city-static-safety.json
          cp autopilot-output/reviewed-city-static-safety.json reports/automation/reviewed-city-static-safety.json
          for item in publisher-exception-review.json publisher-exception-diff-guard.json publisher-exception-static-safety.json; do
            test -s "autopilot-output/$item"
            cp "autopilot-output/$item" "reports/automation/$item"
          done
          for item in milano-2026-review.json milano-2026-diff-guard.json milano-2026-static-guard.json; do
            test -s "autopilot-output/$item"
            cp "autopilot-output/$item" "reports/automation/$item"
          done
          for item in roma-xiii-geo-holds.json roma-xiii-diff-guard.json roma-xiii-static-guard.json; do
            test -s "autopilot-output/$item"
            cp "autopilot-output/$item" "reports/automation/$item"
          done
          for item in roma-xiii-2026-venues.json roma-xiii-2026-venues-diff-guard.json roma-xiii-2026-venues-static-guard.json; do
            test -s "autopilot-output/$item"
            cp "autopilot-output/$item" "reports/automation/$item"
          done
          for item in generic-source-admissions.json generic-source-admissions-diff-guard.json generic-source-admissions-static-guard.json; do
            test -s "autopilot-output/$item"
            cp "autopilot-output/$item" "reports/automation/$item"
          done
      - name: Update ONLY DEV data files if content changed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          report = json.loads(Path('autopilot-output/release-decision.json').read_text())
          if report['has_changes']:
              source = Path('autopilot-output/candidate/public/data/v1')
              target = Path('public/data/v1')
              shutil.rmtree(target)
              shutil.copytree(source, target)
          print('candidate_changed=',report['has_changes'])
          PY
          # Save a compact, long-term operational memory even when the
          # catalog itself is unchanged. This keeps trends and unattended runs
          # visible and prevents silent inactivity of the public repo.
          python backend/autopilot_history.py \
            --decision autopilot-output/release-decision.json \
            --roadmap autopilot-output/roadmap.json \
            --sources autopilot-output/official-candidates.json \
            --source-registry autopilot-output/source-registry.json \
            --freshness autopilot-output/freshness.json \
            --source-evidence autopilot-output/source-evidence.json \
            --lombardia-overlap autopilot-output/lombardia-overlaps.json \
            --bologna-overlap autopilot-output/bologna-overlaps.json \
            --corciano-overlap autopilot-output/corciano-overlaps.json \
            --official-enrichment autopilot-output/official-enrichment.json \
            --catalog-quality autopilot-output/catalog-quality.json \
            --visitor-display-audit autopilot-output/reversible-display-duplicates.json \
            --municipality-report autopilot-output/municipality-reconciliation.json \
            --reviewed-cities-report autopilot-output/reviewed-cities.json \
            --reviewed-city-static-guard autopilot-output/reviewed-city-static-safety.json \
            --roma-xiii-static-guard autopilot-output/roma-xiii-static-guard.json \
            --roma-xiii-2026-report autopilot-output/roma-xiii-2026-venues.json \
            --roma-xiii-2026-final-guard autopilot-output/roma-xiii-2026-venues-static-guard.json \
            --generic-admission-report autopilot-output/generic-source-admissions.json \
            --generic-admission-static-guard autopilot-output/generic-source-admissions-static-guard.json \
            --run-id "${{ github.run_id }}" \
            --out reports/automation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/v1 reports/automation
          if ! git diff --cached --quiet; then
            git commit -m "autopilot: refresh source-bound predicted dates (DEV only)"
            # A non-fast-forward push safely rejects any concurrent change.
            # Never rebase a QA-approved dataset onto untested source code.
            git push origin "HEAD:$DEV_BRANCH"
          else
            echo "No DEV catalog changes, retaining current version."
          fi
      - name: Rebuild ONLY isolated dev-static-preview branch from tested distribution
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          cp -a autopilot-built-site/. "$snapshot/"
          touch "$snapshot/.nojekyll"
          git switch --orphan dev-static-preview
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$snapshot"/. .
          git add -A
          git commit -m "autopilot: approved static DEV preview build"
          git push --force origin HEAD:refs/heads/dev-static-preview
          echo '### Verified DEV preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://raw.githack.com/tommyv-spec/mercati-italia/dev-static-preview/index.html' >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Failure monitoring and automatic GitHub incident
    needs: [candidate, qa, publish_dev]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: autopilot-output
      - uses: actions/github-script@v7
        with:
          script: |
            const results = {
              candidate: '${{ needs.candidate.result }}',
              qa: '${{ needs.qa.result }}',
              publish_dev: '${{ needs.publish_dev.result }}',
            };
            const success = Object.values(results).every(x => x === 'success');
            const title = '[Mercati autopilot] Verifica richiesta';
            const link = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Autopilot run: ${link}\n\nJobs: \`\`\`json\n${JSON.stringify(results,null,2)}\n\`\`\`\n\nPubblicazione DEV bloccata quando uno dei controlli fallisce. I checkpoint (se disponibili) sono negli artefatti del run.`;
            try {
              const {data: issues} = await github.rest.issues.listForRepo({
                ...context.repo, state:'open', per_page:100,
              });
              const issue = issues.find(x => !x.pull_request && x.title === title);
              const freshTitle = '[Mercati autopilot] Dati da verificare';
              const freshIssue = issues.find(x => !x.pull_request && x.title === freshTitle);
              let freshnessAlert = null;
              try {
                const fs = require('fs');
                freshnessAlert = JSON.parse(
                  fs.readFileSync('autopilot-output/freshness-alert.json', 'utf8'));
              } catch (error) {
                core.info('Freshness alert unavailable in this run.');
              }
              if (success && freshnessAlert) {
                if (freshnessAlert.attention_required) {
                  const issueBody = freshnessAlert.body + '\n\nUltimo ciclo completato: ' + link;
                  if (!freshIssue) {
                    await github.rest.issues.create({...context.repo,
                      title: freshTitle, body: issueBody});
                  } else if (!(freshIssue.body || '').includes(
                      'Firma stato: ' + freshnessAlert.signature)) {
                    await github.rest.issues.update({...context.repo,
                      issue_number: freshIssue.number, body: issueBody});
                  }
                } else if (freshIssue) {
                  await github.rest.issues.update({...context.repo,
                    issue_number: freshIssue.number, state: 'closed'});
                }
              }
              if (success) {
                if (issue) {
                  await github.rest.issues.createComment({...context.repo,issue_number:issue.number,body:'Ripristinato: '+link});
                  await github.rest.issues.update({...context.repo,issue_number:issue.number,state:'closed'});
                }
              } else if (issue) {
                await github.rest.issues.createComment({...context.repo,issue_number:issue.number,body});
              } else {
                await github.rest.issues.create({...context.repo,title,body});
              }
            } catch (error) {
              core.warning('GitHub issue notification unavailable: ' + String(error).slice(0,250));
            }
