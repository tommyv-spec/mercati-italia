# Only trusted SCHEDULER lives on main. All implementation, data snapshots and
# publication remain isolated in the DEV branch. No Cloudflare Worker/KV/D1
# or Firebase call occurs when a visitor browses the static preview.
name: Mercati Autopilot — scheduled DEV improvements

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market-autopilot.yml
  schedule:
    - cron: '17 04 * * *'
  workflow_dispatch:
    inputs:
      offline:
        type: boolean
        required: false
        default: false
        description: 'Use existing sources only; no external official feed download'

concurrency:
  group: mercati-autopilot-dev
  cancel-in-progress: false

env:
  DEV_BRANCH: improve/data-quality-security-performance-2026-10-11
  CHECKPOINT_NAME: mercati-checkpoints-${{ github.run_id }}
  BUILD_NAME: mercati-qa-build-${{ github.run_id }}

jobs:
  candidate:
    name: Source → merge → recurrence → export → quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV_BRANCH }}
          persist-credentials: false
      - name: Pin the DEV source revision before collecting evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p autopilot-output
          git rev-parse HEAD > autopilot-output/dev-source-sha.txt
          echo "Pinned DEV revision: $(cat autopilot-output/dev-source-sha.txt)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source adapters and all trusted automation rules
        run: python -m unittest discover -s backend/tests -v
      - name: Run fail-closed Autopilot with checkpoint persistence
        env:
          AUTOPILOT_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$AUTOPILOT_OFFLINE" == "true" ]]; then args+=(--offline); fi
          python backend/autopilot.py --output autopilot-output "${args[@]}"
      - name: Rank improvement opportunities from measured data
        if: success()
        run: |
          python backend/autopilot_feedback.py \
            --manifest autopilot-output/candidate/public/data/v1/manifest.json \
            --out autopilot-output/roadmap.json
          cat autopilot-output/roadmap.md >> "$GITHUB_STEP_SUMMARY"
      - name: Discover new municipal structured sources (read-only, no auto-import)
        if: success()
        env:
          AUTOPILOT_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AUTOPILOT_OFFLINE" == "true" ]]; then
            python backend/source_scout.py --offline --out autopilot-output/official-candidates.json
          else
            python backend/source_scout.py --out autopilot-output/official-candidates.json || {
              echo "::warning::Source discovery offline; keep last approved source adapters."
            }
          fi
      - name: Persist a bounded review-only source intake snapshot
        if: success()
        run: |
          python backend/source_intake.py             --scout autopilot-output/official-candidates.json             --previous reports/automation/source-registry.json             --out autopilot-output/source-registry.json             --report autopilot-output/SOURCE_QUEUE.md
          cat autopilot-output/SOURCE_QUEUE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Sample up to three official source schemas in a bounded read-only sandbox
        if: success()
        env:
          AUTOPILOT_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$AUTOPILOT_OFFLINE" == "true" ]]; then args+=(--offline); fi
          python backend/source_probe.py --registry autopilot-output/source-registry.json --out autopilot-output/source-probes.json --report autopilot-output/SOURCE_SCHEMA.md "${args[@]}"
          cat autopilot-output/SOURCE_SCHEMA.md >> "$GITHUB_STEP_SUMMARY"
      - name: Recheck official publisher metadata and license claims (no import)
        if: success()
        env:
          AUTOPILOT_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$AUTOPILOT_OFFLINE" == "true" ]]; then args+=(--offline); fi
          python backend/source_evidence.py \
            --registry autopilot-output/source-registry.json \
            --out autopilot-output/source-evidence.json \
            --report autopilot-output/SOURCE_EVIDENCE.md \
            "${args[@]}"
          cat autopilot-output/SOURCE_EVIDENCE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit real source age, projected dates and documented verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          max_age="$(python -c 'import json; print(json.load(open("backend/autopilot_policy.json"))["forecast"]["max_source_age_days"])')"
          python backend/freshness_monitor.py \
            --manifest autopilot-output/candidate/public/data/v1/manifest.json \
            --publisher-evidence autopilot-output/source-evidence.json \
            --out autopilot-output/freshness.json \
            --report autopilot-output/FRESHNESS.md \
            --max-source-age-days "$max_age"
          python backend/freshness_alert.py \
            --freshness autopilot-output/freshness.json \
            --out autopilot-output/freshness-alert.json
          cat autopilot-output/FRESHNESS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve checkpoints and candidate even after failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: autopilot-output/
          retention-days: 30
          if-no-files-found: warn

  qa:
    name: Security, compiled static site, mobile browser checks
    needs: candidate
    if: needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV_BRANCH }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: autopilot-output
      - name: Reject QA on a different DEV code revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat autopilot-output/dev-source-sha.txt)"
      - name: Assert newly discovered sources have no automatic import permission
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          info = json.loads(Path('autopilot-output/source-registry.json').read_text())
          if info['record_imports'] != 0 or info['source_licenses_verified_by_automation'] != 0:
              raise ValueError('Source discovery must not import or verify records')
          if any(item['automatic_import_allowed'] for item in info['sources']):
              raise ValueError('Unreviewed dataset granted import permissions')
          print('Metadata-only intake safety check passed.')
          PY
      - name: Reject any source schema preview that grants import authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          probes = json.loads(Path('autopilot-output/source-probes.json').read_text())
          if probes.get('imports') != 0 or probes.get('verified_event_count') != 0:
              raise ValueError('Source schema probing cannot verify or publish markets')
          if len(probes.get('reports', [])) > 3:
              raise ValueError('Sample rate limit exceeded')
          if any(r.get('adapter_enabled') or r.get('source_license_verified')
                 or r.get('events_confirmed') for r in probes['reports']):
              raise ValueError('Schema preview made an unauthorized approval')
          print('Official source schema previews remain quarantine-only.')
          PY
      - name: Reject false inferred market identities and unknown-coordinate labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          probes = json.loads(Path('autopilot-output/source-probes.json').read_text())
          name_false_friends = {'tipologia_mercato', 'nome_quartiere', 'nome_zona',
                                'note_mercato', 'anno_istituzione_mercato'}
          for item in probes['reports']:
              hints = item.get('field_hints', {})
              values = {name.casefold() for name in hints.get('name', [])}
              if values & name_false_friends:
                  raise ValueError('False market-name inference in official data: ' + item['id'])
              coordinates = {name.casefold() for key in ('latitude', 'longitude')
                             for name in hints.get(key, [])}
              if coordinates & {'geo_x', 'geo_y'}:
                  raise ValueError('Coordinates without verified CRS were treated as degrees')
              if item.get('status') == 'schema_preview_only' and not item.get('fields'):
                  raise ValueError('Empty schema was accepted')
          print('Market identity and coordinate inference remained conservative.')
          PY
      - name: Block false freshness or official-source approvals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('autopilot-output/source-evidence.json').read_text())
          freshness = json.loads(Path('autopilot-output/freshness.json').read_text())
          alert = json.loads(Path('autopilot-output/freshness-alert.json').read_text())
          if (report.get('market_imports') != 0
                  or report.get('market_events_confirmed') != 0
                  or report.get('legal_license_approvals') != 0):
              raise ValueError('Publisher metadata approved markets or licenses')
          if any(row.get('import_permission_granted') or row.get('license_legally_reviewed')
                 or row.get('record_level_freshness_verified')
                 for row in report['source_evidence']):
              raise ValueError('Publisher metadata granted unauthorized publication privileges')
          if (freshness.get('catalog_was_modified') is not False
                  or not freshness.get('safe_for_automatic_quality_promotion')):
              raise ValueError('Unsupported confirmed date or future timestamp: see FRESHNESS.md')
          if alert.get('problems', {}).get('total') != freshness['metrics']['total']:
              raise ValueError('Freshness alert/report mismatch')
          print('Publisher rights, source age and event verification QA passed.')
          PY
      - name: Verify candidate approved and replace ONLY local static data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          decision = json.loads(Path('autopilot-output/release-decision.json').read_text())
          if not decision['approved']:
              raise ValueError('Candidate was not approved by the policy engine')
          candidate = Path('autopilot-output/candidate/public/data/v1')
          if not (candidate / 'manifest.json').is_file():
              raise ValueError('Approved catalog artifact missing')
          target = Path('public/data/v1')
          shutil.rmtree(target)
          shutil.copytree(candidate, target)
          print('Candidate installed in ephemeral QA runner only.')
          PY
      - name: Verify hashes, index and conservative source integrity
        run: python backend/validate_static.py --manifest public/data/v1/manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependency, data grouping and static build checks
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node --test tests/marketGrouping.test.mjs
          npm run build -- --base=./
      - name: Prove ordinary Cloudflare catalog visits avoid Functions
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const routes = JSON.parse(fs.readFileSync('dist/_routes.json', 'utf8'))
          if (routes.include.some(x => x === '/*' || x === '/') ||
              !routes.exclude.includes('/data/*')) {
            throw new Error('Cloudflare Functions could intercept normal market visits')
          }
          console.log('Static catalog and page routing verified')
          NODE
      - name: Install mobile browser for end-to-end smoke
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start locally built static site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mercati-autopilot-preview.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/mercati-autopilot-preview.log
          exit 1
      - name: Exercise real user flows — no billed backend calls
        env:
          UI_BASE: http://127.0.0.1:4173/
        run: node tests/ui-smoke.mjs
      - name: Save tested static distribution (for separate DEV publication)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Save mobile QA and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercati-autopilot-mobile-${{ github.run_id }}
          path: |
            ux-*.png
            ux-smoke-result.json
            /tmp/mercati-autopilot-preview.log
          retention-days: 30
          if-no-files-found: warn

  publish_dev:
    name: Update DEV catalog + separately hosted static preview
    needs: [candidate, qa]
    if: needs.candidate.result == 'success' && needs.qa.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV_BRANCH }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_NAME }}
          path: autopilot-output
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: autopilot-built-site
      - name: Refuse publication if DEV moved after candidate build
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat autopilot-output/dev-source-sha.txt)"
          test "$(git rev-parse HEAD)" = "$expected"
          git fetch origin "$DEV_BRANCH"
          test "$(git rev-parse "origin/$DEV_BRANCH")" = "$expected"
      - name: Prevent overwriting newer DEV catalog changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$DEV_BRANCH"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report = json.loads(Path('autopilot-output/release-decision.json').read_text())
          if not report.get('approved'):
              raise ValueError('Autopilot policy did not approve this candidate')
          actual = subprocess.check_output(
              ['git', 'show', 'origin/' + subprocess.check_output(
                  ['git', 'branch', '--show-current'], text=True).strip()
               + ':public/data/v1/manifest.json'], text=True)
          current = json.loads(actual)
          if current['content_signature'] != report['base_signature']:
              raise ValueError('DEV market catalog changed after QA: refusing stale overwrite')
          target = Path('autopilot-output/candidate/public/data/v1/manifest.json')
          if not target.is_file() or json.loads(target.read_text())['content_signature'] != report['new_signature']:
              raise ValueError('Candidate artifact signature mismatch')
          PY
      - name: Stage QA-approved source discovery history for DEV only
        shell: bash
        run: |
          set -euo pipefail
          test -s autopilot-output/source-registry.json
          test -s autopilot-output/SOURCE_QUEUE.md
          mkdir -p reports/automation
          cp autopilot-output/source-registry.json reports/automation/source-registry.json
          cp autopilot-output/SOURCE_QUEUE.md reports/automation/SOURCE_QUEUE.md
          test -s autopilot-output/source-probes.json
          test -s autopilot-output/SOURCE_SCHEMA.md
          cp autopilot-output/source-probes.json reports/automation/source-probes.json
          cp autopilot-output/SOURCE_SCHEMA.md reports/automation/SOURCE_SCHEMA.md
          for item in source-evidence.json SOURCE_EVIDENCE.md freshness.json FRESHNESS.md freshness-alert.json; do
            test -s "autopilot-output/$item"
            cp "autopilot-output/$item" "reports/automation/$item"
          done
      - name: Update ONLY DEV data files if content changed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          report = json.loads(Path('autopilot-output/release-decision.json').read_text())
          if report['has_changes']:
              source = Path('autopilot-output/candidate/public/data/v1')
              target = Path('public/data/v1')
              shutil.rmtree(target)
              shutil.copytree(source, target)
          print('candidate_changed=',report['has_changes'])
          PY
          # Save a compact, long-term operational memory even when the
          # catalog itself is unchanged. This keeps trends and unattended runs
          # visible and prevents silent inactivity of the public repo.
          python backend/autopilot_history.py \
            --decision autopilot-output/release-decision.json \
            --roadmap autopilot-output/roadmap.json \
            --sources autopilot-output/official-candidates.json \
            --source-registry autopilot-output/source-registry.json \
            --freshness autopilot-output/freshness.json \
            --source-evidence autopilot-output/source-evidence.json \
            --run-id "${{ github.run_id }}" \
            --out reports/automation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/v1 reports/automation
          if ! git diff --cached --quiet; then
            git commit -m "autopilot: refresh source-bound predicted dates (DEV only)"
            # A non-fast-forward push safely rejects any concurrent change.
            # Never rebase a QA-approved dataset onto untested source code.
            git push origin "HEAD:$DEV_BRANCH"
          else
            echo "No DEV catalog changes, retaining current version."
          fi
      - name: Rebuild ONLY isolated dev-static-preview branch from tested distribution
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          cp -a autopilot-built-site/. "$snapshot/"
          touch "$snapshot/.nojekyll"
          git switch --orphan dev-static-preview
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$snapshot"/. .
          git add -A
          git commit -m "autopilot: approved static DEV preview build"
          git push --force origin HEAD:refs/heads/dev-static-preview
          echo '### Verified DEV preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://raw.githack.com/tommyv-spec/mercati-italia/dev-static-preview/index.html' >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Failure monitoring and automatic GitHub incident
    needs: [candidate, qa, publish_dev]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const results = {
              candidate: '${{ needs.candidate.result }}',
              qa: '${{ needs.qa.result }}',
              publish_dev: '${{ needs.publish_dev.result }}',
            };
            const success = Object.values(results).every(x => x === 'success');
            const title = '[Mercati autopilot] Verifica richiesta';
            const link = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Autopilot run: ${link}\n\nJobs: \`\`\`json\n${JSON.stringify(results,null,2)}\n\`\`\`\n\nPubblicazione DEV bloccata quando uno dei controlli fallisce. I checkpoint (se disponibili) sono negli artefatti del run.`;
            try {
              const {data: issues} = await github.rest.issues.listForRepo({
                ...context.repo, state:'open', per_page:100,
              });
              const issue = issues.find(x => !x.pull_request && x.title === title);
              if (success) {
                if (issue) {
                  await github.rest.issues.createComment({...context.repo,issue_number:issue.number,body:'Ripristinato: '+link});
                  await github.rest.issues.update({...context.repo,issue_number:issue.number,state:'closed'});
                }
              } else if (issue) {
                await github.rest.issues.createComment({...context.repo,issue_number:issue.number,body});
              } else {
                await github.rest.issues.create({...context.repo,title,body});
              }
            } catch (error) {
              core.warning('GitHub issue notification unavailable: ' + String(error).slice(0,250));
            }
