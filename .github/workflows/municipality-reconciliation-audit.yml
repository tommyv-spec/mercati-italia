# On-demand and initial PR verification; NEVER publishes the actual DEV catalog.
# Re-runnable after migration: accept 0 changes if the fixes are already present.
name: ISTAT 2026 municipality reconciliation — full dry-run (no publish)

on:
  workflow_dispatch:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/municipality-reconciliation-audit.yml
      - backend/municipality_reconciliation.py
      - backend/municipality_release_guard.py
      - backend/tests/test_municipality_reconciliation.py
      - backend/tests/test_municipality_release_guard.py

permissions:
  contents: read

concurrency:
  group: istat-municipal-reconciliation-dry-run
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Replay all Python source quality and source-identity tests
        run: python -m unittest discover -s backend/tests -q
      - name: Create offline-only temporary ISTAT-enabled policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          source = Path('backend/data/istat-comuni-2026.json')
          data=json.loads(source.read_text('utf-8'))
          assert data['municipality_count']==7894
          assert data['reference_date']=='2026-02-21'
          assert data['source_file_sha256']=='83842076860450f7e482daecea6b7a769f5f93d0bf5b0d48802b44896d7a26d5'
          config=json.loads(Path('backend/autopilot_policy.json').read_text('utf-8'))
          config['municipalities']={
              'enabled':True,
              'reference_date':'2026-02-21',
              'source_sha256':'83842076860450f7e482daecea6b7a769f5f93d0bf5b0d48802b44896d7a26d5'
          }
          Path('/tmp/istat-municipality-policy.json').write_text(
              json.dumps(config),encoding='utf-8')
          print('OFFICIAL_ISTAT',data['municipality_count'],'municipalities')
          PY
      - name: Full national dry-run with static source snapshot (no web calls)
        run: |
          python backend/autopilot.py \
            --offline \
            --policy /tmp/istat-municipality-policy.json \
            --output municipality-integration-trial
      - name: Recheck exact before-and-after field modifications
        run: |
          python backend/municipality_release_guard.py \
            --before municipality-integration-trial/intermediate/merged.json \
            --after municipality-integration-trial/intermediate/municipalities.json \
            --report municipality-integration-trial/municipality-reconciliation.json \
            --out municipality-integration-trial/recheck-municipalities.json
          python - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0,'backend')
          from merge_catalog import load_existing
          from catalog_quality_report import analyze
          from validate_static import validate
          from municipality_release_guard import check
          root=Path('municipality-integration-trial')
          before=load_existing(Path('public/data/v1/manifest.json'))
          manifest=root/'candidate/public/data/v1/manifest.json'
          validate(manifest)
          after=load_existing(manifest)
          report=json.loads((root/'municipality-reconciliation.json').read_text())
          gate=json.loads((root/'municipality-release-guard.json').read_text())
          decision=json.loads((root/'release-decision.json').read_text())
          if not decision['approved']:
              raise ValueError('Existing release gates rejected ISTAT candidate')
          if set(x['slug'] for x in before)!=set(x['slug'] for x in after):
              raise ValueError('Municipality process removed/created market IDs')
          old_quality=analyze(before)
          new_quality=analyze(after)
          # Already approved municipal updates cannot recur a second time.
          if old_quality['metrics'].get('suspicious_city',0)>=50:
              assert gate['city_replacements']>=25, 'Initial 2026 correction did not run'
              assert gate['calendar_sources_quarantined']>=15
          else:
              assert gate['city_replacements']<=old_quality['metrics'].get('suspicious_city',0)
          assert new_quality['metrics'].get('suspicious_city',0) <= old_quality['metrics'].get('suspicious_city',0)
          assert new_quality['metrics'].get('future_date_quality_mismatch',0)==0
          assert gate['publisher_urls_or_human_verifications_changed']==0
          assert gate['source_istat_sha']==report['source_file_sha256']
          assert decision['municipalities_reconciled']==gate['city_replacements']
          assert gate['checked_ids']==len(before)
          summary={
              'original_records':len(before),'candidate_records':len(after),
              'city_suspects_before':old_quality['metrics'].get('suspicious_city',0),
              'city_suspects_after':new_quality['metrics'].get('suspicious_city',0),
              'cities_corrected':gate['city_replacements'],
              'title_corrections':gate['contaminated_titles_repaired'],
              'calendars_quarantined':gate['calendar_sources_quarantined'],
              'unsupported_dates_suspended':gate['forecast_dates_removed'],
              'individual_confirmations_created':0,
              'removed_ids':0,'quality_passed':decision['approved'],
              'all_istat_guard_rules_passed':True,
              'needs_manual_review':report['counts'].get('needs_manual_municipality_review',0)
          }
          (root/'integration-summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('ISTAT_MUNICIPALITY_AUDIT',json.dumps(summary,ensure_ascii=False))
          PY
      - name: Mount candidate only in isolated runner for frontend test
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          dest=Path('public/data/v1')
          shutil.rmtree(dest)
          shutil.copytree(Path('municipality-integration-trial/candidate/public/data/v1'),dest)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build, verify no paid runtime, and replay JS regressions
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node --test tests/*.test.mjs
          npm run build -- --base=./
      - name: Headless mobile site interaction test
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/municipal-preview.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          UI_BASE=http://127.0.0.1:4173/ node tests/ui-smoke.mjs
      - name: Retain evidence and checkpoints, never publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istat-municipality-full-dryrun
          retention-days: 30
          if-no-files-found: warn
          path: |
            municipality-integration-trial/checkpoints/
            municipality-integration-trial/municipality-reconciliation.json
            municipality-integration-trial/municipality-release-guard.json
            municipality-integration-trial/recheck-municipalities.json
            municipality-integration-trial/integration-summary.json
            municipality-integration-trial/release-decision.json
            municipality-integration-trial/MUNICIPALITY_RECONCILIATION.md
            ux-smoke-result.json
            ux-*.png
