# Daily evidence-only replay of exact reviewed official source adapters.
name: Official source extraction accuracy — five adapters (DEV only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/official-source-output-qa.yml
  schedule:
    - cron: '27 09 * * *'
  workflow_dispatch:

concurrency:
  group: mercati-all-dev-report-and-catalog-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source_qa:
    name: Recheck field mapping of each existing official market publisher
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin DEV source revision and run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-qa-output
          git rev-parse HEAD > official-qa-output/dev-source-sha.txt
          python -m unittest discover -s backend/tests -v
      - name: Inspect five official source adapters against original publisher snapshots
        shell: bash
        run: |
          set -euo pipefail
          python backend/official_source_output_audit.py \
            --previous reports/automation/official-source-output-qa.json \
            --out official-qa-output/official-source-output-qa.json \
            --report official-qa-output/OFFICIAL_SOURCE_OUTPUT_QA.md
      - name: Enforce read-only source and freshness distinction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'backend')
          from official_source_output_audit import validate,ALL_SOURCES
          report=json.loads(Path('official-qa-output/official-source-output-qa.json').read_text('utf-8'))
          validate(report)
          if set(x['source_id'] for x in report['sources'])!=set(ALL_SOURCES):
              raise ValueError('Missing an official source from publisher audit')
          if report['source_batches_passed']==0:
              raise ValueError('No source validated today; preserve last-good report, do not fake freshness')
          for row in report['sources']:
              if row['status']!='source_output_passed' and row.get('current_publisher_gate'):
                  raise ValueError('Unavailable source misrepresented as checked now')
          print('ALL_OFFICIAL_ADAPTERS_QA',report['source_batches_passed'],
                'passed;',report['source_batches_unavailable_or_changed'],
                'unavailable or blocked; zero catalog updates')
          PY
          cat official-qa-output/OFFICIAL_SOURCE_OUTPUT_QA.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep per-source QA evidence even on blocked run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-market-source-output-qa
          path: official-qa-output/
          retention-days: 30
          if-no-files-found: warn

  publish_review:
    name: Commit aggregate official data QA to DEV, never production
    needs: source_qa
    if: needs.source_qa.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: official-market-source-output-qa
          path: official-qa-output/
      - name: Guard against concurrent DEV changes and persist only two reports
        shell: bash
        run: |
          set -euo pipefail
          test -s official-qa-output/official-source-output-qa.json
          test -s official-qa-output/OFFICIAL_SOURCE_OUTPUT_QA.md
          test "$(cat official-qa-output/dev-source-sha.txt)" = "$(git rev-parse HEAD)"
          mkdir -p reports/automation
          cp official-qa-output/official-source-output-qa.json reports/automation/official-source-output-qa.json
          cp official-qa-output/OFFICIAL_SOURCE_OUTPUT_QA.md reports/automation/OFFICIAL_SOURCE_OUTPUT_QA.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/automation/official-source-output-qa.json \
            reports/automation/OFFICIAL_SOURCE_OUTPUT_QA.md
          if ! git diff --cached --quiet; then
            git commit -m "audit(dev): verify official source field mappings and output contracts"
            git push origin HEAD:improve/data-quality-security-performance-2026-10-11
          fi
          echo "All checks source-only. No new markets, confirmed dates, or precise coordinates were published." >> "$GITHUB_STEP_SUMMARY"
