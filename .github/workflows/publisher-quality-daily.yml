# Source-by-source QA ranked by actual market count, plus bounded schema probes.
# Replay Oct 18: bounded editorial page budget fix; DEV research only.
name: Publisher data quality — all catalog sources (DEV only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publisher-quality-daily.yml
  schedule:
    - cron: '52 08 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercati-all-dev-report-and-catalog-writes
  cancel-in-progress: false

jobs:
  audit:
    name: Audit every source and track large publisher template drift
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record actual DEV source revision and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-output
          git rev-parse HEAD > quality-output/dev-head-sha.txt
          python -m unittest discover -s backend/tests -v
      - name: Audit every real publisher and every official candidate
        shell: bash
        run: |
          set -euo pipefail
          python backend/publisher_quality_matrix.py \
            --manifest public/data/v1/manifest.json \
            --registry reports/automation/source-registry.json \
            --probes reports/automation/source-probes.json \
            --previous reports/automation/publisher-quality-matrix.json \
            --out quality-output/publisher-quality-matrix.json \
            --report quality-output/PUBLISHER_QUALITY_MATRIX.md
      - name: Check exactly reviewed external page structures without copying facts
        shell: bash
        run: |
          set -euo pipefail
          python backend/publisher_template_monitor.py \
            --previous reports/automation/publisher-template-status.json \
            --out quality-output/publisher-template-status.json \
            --report quality-output/PUBLISHER_TEMPLATE_STATUS.md
      - name: Enforce independent report safety and identify network/layout failures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'backend')
          from publisher_quality_matrix import validate as check_publishers
          from publisher_template_monitor import validate as check_templates
          from merge_catalog import load_existing
          o=Path('quality-output')
          registry=json.loads(Path('reports/automation/source-registry.json').read_text('utf-8'))
          publishers=json.loads((o/'publisher-quality-matrix.json').read_text('utf-8'))
          templates=json.loads((o/'publisher-template-status.json').read_text('utf-8'))
          check_publishers(publishers,registry)
          check_templates(templates)
          total=len(load_existing(Path('public/data/v1/manifest.json')))
          if publishers['catalog_record_count']!=total:
              raise ValueError('Publisher QA summary diverged from the catalog')
          if publishers['official_candidate_dataset_count']!=len(registry['sources']):
              raise ValueError('A candidate registry entry escaped publisher QA')
          statuses={x['template_id']:x['state'] for x in templates['templates']}
          scanned=sum(v in ('schema_unchanged_or_sufficient','schema_changed_review_required')
                      for v in statuses.values())
          # A complete outage must never replace the last inspected
          # successful source schema with a new "empty" baseline.
          state={'schema':1,'as_of':publishers['as_of'],
                 'research_only':True,
                 'full_catalog_source_labels':publishers['catalog_source_labels_count'],
                 'catalog_market_count':total,
                 'official_candidate_datasets':len(registry['sources']),
                 'template_states':statuses,
                 'publisher_templates_inspected':scanned,
                 'preserve_last_inspected_template_when_offline':scanned==0,
                 'market_updates':0,'verified_events':0}
          (o/'publisher-scan-status.json').write_text(
              json.dumps(state,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('PUBLISHER_AUDIT_SAFE',json.dumps(state,sort_keys=True))
          PY
          cat quality-output/PUBLISHER_QUALITY_MATRIX.md >> "$GITHUB_STEP_SUMMARY"
      - name: Store source quality and publisher template audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-market-source-quality-review
          path: quality-output/
          retention-days: 30
          if-no-files-found: warn

  publish_review:
    name: Save aggregate source QA, no catalog data writes
    needs: audit
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: all-market-source-quality-review
          path: quality-output/
      - name: Reject stale source revision and publish only approved research files
        shell: bash
        run: |
          set -euo pipefail
          test -s quality-output/publisher-quality-matrix.json
          test -s quality-output/PUBLISHER_QUALITY_MATRIX.md
          test -s quality-output/publisher-scan-status.json
          test "$(cat quality-output/dev-head-sha.txt)" = "$(git rev-parse HEAD)"
          mkdir -p reports/automation
          cp quality-output/publisher-quality-matrix.json reports/automation/publisher-quality-matrix.json
          cp quality-output/PUBLISHER_QUALITY_MATRIX.md reports/automation/PUBLISHER_QUALITY_MATRIX.md
          cp quality-output/publisher-scan-status.json reports/automation/publisher-scan-status.json
          git add -- reports/automation/publisher-quality-matrix.json \
            reports/automation/PUBLISHER_QUALITY_MATRIX.md \
            reports/automation/publisher-scan-status.json
          if grep -q '"preserve_last_inspected_template_when_offline": false' quality-output/publisher-scan-status.json; then
            cp quality-output/publisher-template-status.json reports/automation/publisher-template-status.json
            cp quality-output/PUBLISHER_TEMPLATE_STATUS.md reports/automation/PUBLISHER_TEMPLATE_STATUS.md
            git add -- reports/automation/publisher-template-status.json \
              reports/automation/PUBLISHER_TEMPLATE_STATUS.md
          else
            echo "::warning::All third-party page probes unavailable. Preserving old layout evidence."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "audit(dev): rank every market publisher and check source layout drift"
            git push origin HEAD:improve/data-quality-security-performance-2026-10-11
          fi
          echo "Read-only source QA complete; no public market data changed." >> "$GITHUB_STEP_SUMMARY"
