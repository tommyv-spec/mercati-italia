name: Rebuild curated static catalog
on:
  workflow_dispatch:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/rebuild-static.yml
      - backend/export_static.py
      - backend/tests/test_static_pipeline.py

permissions:
  contents: write

concurrency:
  group: guarded-static-market-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test source, classification, deduplication and catalog gates
        run: python -m unittest discover -s backend/tests -v
      - name: Save rollback checkpoint
        run: |
          test -s public/data/v1/manifest.json
          tar -czf /tmp/static-before-rebuild.tgz public/data/v1
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-before-rebuild
          path: /tmp/static-before-rebuild.tgz
          retention-days: 7
      - name: Rebuild from current snapshot without network or Firebase
        run: python backend/reprocess_snapshot.py
      - name: Verify all hashes and index
        run: python backend/validate_static.py --manifest public/data/v1/manifest.json
      - name: Save rebuilt snapshot to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/v1
          if ! git diff --cached --quiet; then
            git commit -m "data: rebuild conservative de-duplicated market snapshots"
            git push
          fi
