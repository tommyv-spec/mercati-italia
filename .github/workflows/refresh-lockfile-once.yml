name: One-time regenerate frontend lockfile
on:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/refresh-lockfile-once.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync lockfile after removing Firebase browser SDK
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate production build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit only lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize lockfile after removing Firebase client"
            git push
          fi
