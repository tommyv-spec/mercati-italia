name: Refresh reviewed static snapshot once — slim index
on:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/refresh-review-once.yml

permissions:
  contents: write

concurrency:
  group: static-data-review-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify full prior static snapshot
        run: test -s public/data/v1/manifest.json
      - name: Official Milano coordinates and recurrence
        run: python backend/source_milano.py --output /tmp/milano_markets.json
      - name: Official Firenze locations
        run: python backend/source_firenze.py --output /tmp/firenze_markets.json
      - name: Conservative incremental merge
        run: |
          python backend/merge_catalog.py --new /tmp/milano_markets.json --new /tmp/firenze_markets.json --out /tmp/merged_markets.json
      - name: Rebuild snapshots with one light index + cached regional details
        run: |
          python backend/export_static.py --input /tmp/merged_markets.json --min-count 12000 --max-drop-ratio 0.02
      - name: Full content-signature and search-index validation
        run: python backend/validate_static.py --manifest public/data/v1/manifest.json
      - name: Commit safe snapshot checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/v1
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: add fast national index and official Milan/Florence location fixes"
            git push
          fi
