# Read-only geographic/source-field research; one publisher dataset at a time.
name: Regional field reconciliation — Lombardia + Veneto (DEV only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regional-field-reconciliation.yml
  schedule:
    - cron: '13 08 * * *'
  workflow_dispatch:

concurrency:
  group: mercati-all-dev-report-and-catalog-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Verify reviewed source layouts and compare fields (no market updates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin DEV revision and test independent validators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p regional-output
          git rev-parse HEAD > regional-output/dev-source-sha.txt
          python -m unittest discover -s backend/tests -v
      - name: Compare ALL official Lombardia rows to the existing static catalog
        shell: bash
        run: |
          set -euo pipefail
          if python backend/source_reconciliation_audit.py \
              --out regional-output/lombardia-field-audit.json \
              --report regional-output/LOMBARDIA_FIELD_AUDIT.md; then
            echo 'success' > regional-output/lombardia-status.txt
          else
            echo 'unavailable_or_source_contract_changed' > regional-output/lombardia-status.txt
            echo "::warning::Lombardia official feed failed; do not invent field matches or missing markets."
            rm -f regional-output/lombardia-field-audit.json regional-output/LOMBARDIA_FIELD_AUDIT.md
          fi
      - name: Inspect official Veneto event XLSX structure without persisting events
        shell: bash
        run: |
          set -euo pipefail
          if python backend/veneto_event_workbook_probe.py \
              --out regional-output/veneto-event-schema.json \
              --report regional-output/VENETO_EVENT_SCHEMA.md; then
            echo 'success' > regional-output/veneto-status.txt
          else
            echo 'unavailable_or_source_contract_changed' > regional-output/veneto-status.txt
            echo "::warning::Veneto XLSX is unavailable or structure changed; keep previous research and do not publish events."
            rm -f regional-output/veneto-event-schema.json regional-output/VENETO_EVENT_SCHEMA.md
          fi
      - name: Independent read-only field and source status gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          o = Path('regional-output')
          status = {}
          lo=o/'lombardia-field-audit.json'
          ve=o/'veneto-event-schema.json'
          if lo.exists():
              r=json.loads(lo.read_text('utf-8'))
              if (r.get('schema')!=1 or r.get('read_only') is not True
                  or r.get('region')!='Lombardia'
                  or r.get('source')!='https://www.dati.lombardia.it/d/68zx-njaw'
                  or not 1000<=r.get('official_row_count',0)<=3000
                  or any(r.get(k)!=0 for k in (
                      'market_updates_applied','markets_added','markets_deleted',
                      'individual_openings_confirmed','precise_coordinates_created',
                      'new_directions_enabled','legacy_primary_sources_changed'))):
                  raise ValueError('Lombardia reconciliation made unsupported field claims')
              status['lombardia']='review_only'
          else:
              status['lombardia']='unavailable'
          if ve.exists():
              r=json.loads(ve.read_text('utf-8'))
              if (r.get('schema')!=1 or r.get('schema_only') is not True
                  or r.get('source_rights_to_copy_event_rows_reviewed') is not False
                  or not 1<=r.get('sheet_count',0)<=12
                  or any(r.get(k)!=0 for k in (
                      'market_catalog_imports','market_catalog_updates',
                      'verified_market_openings','event_rows_persisted'))):
                  raise ValueError('Veneto XLSX falsely granted reuse or imported events')
              status['veneto']='review_only'
          else:
              status['veneto']='unavailable'
          (o/'source-check-status.json').write_text(
              json.dumps({'schema':1,'review_only':True,'sources':status,
                          'catalog_records_modified':0,
                          'events_confirmed':0},sort_keys=True,indent=2)+'\n',
              encoding='utf-8')
          if all(v=='unavailable' for v in status.values()):
              raise ValueError('Both publishers unavailable: keep previous report, no false freshness')
          print('REGIONAL_DATA_SOURCE_QA',status)
          PY
      - name: Preserve individual source reports and diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-source-field-audit
          path: regional-output/
          retention-days: 30
          if-no-files-found: warn

  publish_review:
    name: Save only read-only comparison reports to DEV
    needs: inspect
    if: needs.inspect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: regional-source-field-audit
          path: regional-output/
      - name: Refuse stale QA and only write bounded research reports
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat regional-output/dev-source-sha.txt)" = "$(git rev-parse HEAD)"
          test -s regional-output/source-check-status.json
          mkdir -p reports/automation
          cp regional-output/source-check-status.json reports/automation/regional-field-source-status.json
          for item in lombardia-field-audit.json LOMBARDIA_FIELD_AUDIT.md veneto-event-schema.json VENETO_EVENT_SCHEMA.md; do
            if [ -s "regional-output/$item" ]; then
              cp "regional-output/$item" "reports/automation/$item"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/automation/regional-field-source-status.json
          for item in lombardia-field-audit.json LOMBARDIA_FIELD_AUDIT.md veneto-event-schema.json VENETO_EVENT_SCHEMA.md; do
            if [ -s "regional-output/$item" ]; then
              git add -- "reports/automation/$item"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "audit(dev): measure official Lombardia field joins and Veneto 2026 XLSX schema"
            git push origin HEAD:improve/data-quality-security-performance-2026-10-11
          fi
          echo 'DEV-only source field research; no market or event row modified.' >> "$GITHUB_STEP_SUMMARY"
