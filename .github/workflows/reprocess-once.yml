name: One-time normalize accepted regions (review branch)
on:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/reprocess-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source catalog is present
        run: test -s public/data/v1/manifest.json
      - name: Reprocess snapshot without rereading paid databases
        run: python backend/reprocess_snapshot.py --prune-stale
      - name: Verify resulting 20 Italian regions
        run: python backend/validate_static.py --manifest public/data/v1/manifest.json
      - name: Commit upgraded static snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/v1
          git commit -m "data: normalize all market regions and expose completeness"
          git push
