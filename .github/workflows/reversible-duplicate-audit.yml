# Manual proof -> deterministic script -> quantitative, read-only full catalog run.
# Does not publish to DEV or production, or delete any market identity.
name: Market repeated-visit display audit (no publish)

on:
  workflow_dispatch:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/reversible-duplicate-audit.yml
      - scripts/reversible-duplicate-audit.mjs
      - tests/reversible-duplicate-audit.test.mjs
      - src/lib/marketGrouping.js

permissions:
  contents: read

concurrency:
  group: reversible-display-quality-proof
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test pure display identity preservation first
        run: |
          npm ci --no-audit --no-fund
          node --test tests/marketGrouping.test.mjs tests/reversible-duplicate-audit.test.mjs
      - name: Measure all twenty regional shards, not partial sampling
        run: |
          node scripts/reversible-duplicate-audit.mjs \
            --manifest public/data/v1/manifest.json \
            --out duplicate-display-evidence.json \
            --report DUPLICATE_DISPLAY_EVIDENCE.md
      - name: Fail if reports delete original rows or invent market confirmations
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const m = JSON.parse(fs.readFileSync('public/data/v1/manifest.json','utf8'))
          const x = JSON.parse(fs.readFileSync('duplicate-display-evidence.json','utf8'))
          const d = x.metrics
          if (d.original_records !== m.total ||
              d.ids_retained !== m.total ||
              d.market_identities_deleted !== 0 ||
              d.event_confirmations_created !== 0 ||
              d.verification_claims_created !== 0 ||
              d.suppressed_repeat_buttons_only > d.original_records_in_reversible_groups ||
              d.highly_supported_same_source_visit_groups < 25) {
            throw new Error('Unsafe or unexpectedly ineffective duplicate grouping')
          }
          console.log('WEEKLY_DISPLAY_DUPLICATE_METRICS',JSON.stringify(d))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversible-market-duplicate-audit
          retention-days: 30
          path: |
            duplicate-display-evidence.json
            DUPLICATE_DISPLAY_EVIDENCE.md
          if-no-files-found: warn
