# Strictly temporary source review: changes no real DEV/production catalog.
name: Rome XIII two mismapped market points — full source QA (no publish)
on:
  push:
    branches: [improve/data-quality-security-performance-2026-10-11]
    paths:
      - .github/workflows/roma-xiii-geo-hold-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify every existing source and new Rome quarantine test
        run: python -m unittest discover -s backend/tests -v
      - name: Enable exact Rome source hold ONLY in disposable review policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('backend/autopilot_policy.json').read_text('utf-8'))
          p['roma_xiii_coordinate_holds']={
              'enabled':True,'reviewed_on':'2026-10-12',
              'source_blob_sha1':'21c5b8e0b9415238f3953021661e79cd85ac7385',
          }
          Path('/tmp/rome-xiii-safety-policy.json').write_text(
              json.dumps(p,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Full Autopilot offline pipeline with independently checked source evidence
        run: |
          python backend/autopilot.py \
            --offline --today 2026-10-12 \
            --policy /tmp/rome-xiii-safety-policy.json \
            --output roma-xiii-hold-review
      - name: Compare every original ID, protected source and final static index
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'backend')
          from merge_catalog import load_existing
          from roma_xiii_geo_hold import (
              verify_diff, verify_static, validate_map, apply_holds,
          )
          out=Path('roma-xiii-hold-review')
          before=json.loads((out/'intermediate/rome-before-geo-holds.json').read_text('utf-8'))
          after=json.loads((out/'intermediate/rome-after-geo-holds.json').read_text('utf-8'))
          original=load_existing(Path('public/data/v1/manifest.json'))
          candidate=out/'candidate/public/data/v1/manifest.json'
          published=load_existing(candidate)
          source=json.loads(Path('backend/data/roma-municipio-xiii-market-map-reviewed.json').read_text('utf-8'))
          report=json.loads((out/'roma-xiii-geo-holds.json').read_text('utf-8'))
          diff=json.loads((out/'roma-xiii-diff-guard.json').read_text('utf-8'))
          final=json.loads((out/'roma-xiii-static-guard.json').read_text('utf-8'))
          decision=json.loads((out/'release-decision.json').read_text('utf-8'))
          actual=verify_diff(before,after,report,source)
          static=verify_static(candidate,source)
          replay,replay_report=apply_holds(after,source,apply=True)
          if (actual!=diff or static!=final or not decision['approved']
              or len(original) not in (13779,13784) or len(published)!=len(original)
              or {x['slug'] for x in original}!={x['slug'] for x in published}
              or (report['new_coordinates_quarantined']
                  + report.get('already_quarantined',0))!=2
              or report['new_directions_blocked']!=report['new_coordinates_quarantined']
              or final['current_coordinate_holds']!=2
              or final['current_navigation_holds']!=2
              or after!=replay
              or replay_report['new_coordinates_quarantined']!=0
              or replay_report['new_directions_blocked']!=0
              or replay_report['already_quarantined']!=2):
              raise ValueError('Rome source safety, idempotence or catalog integrity mismatch')
          summary={
              'original_records':len(original),
              'candidate_records':len(published),
              'new_coordinate_points_quarantined_this_run':report['new_coordinates_quarantined'],
              'coordinate_points_still_quarantined':final['current_coordinate_holds'],
              'new_directions_blocked_this_run':report['new_directions_blocked'],
              'navigation_routes_still_blocked':final['current_navigation_holds'],
              'idempotent_replay_passed':True,
              'new_market_ids':0,
              'source_urls_overwritten':0,
              'individual_openings_verified':0,
              'new_geocodes':0,
              'published':False,
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n','utf-8')
          print('ROME_XIII_GEO_SAFETY_REHEARSAL',json.dumps(summary))
          PY
      - name: Run actual mobile browsing only against ephemeral built site
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          dst=Path('public/data/v1')
          shutil.rmtree(dst)
          shutil.copytree('roma-xiii-hold-review/candidate/public/data/v1',dst)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and verify mobile-safe site
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node --test tests/*.test.mjs
          npm run build -- --base=./
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/roma-xiii-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          UI_BASE=http://127.0.0.1:4173/ node tests/roma-xiii-geo-hold-ui.mjs
          UI_BASE=http://127.0.0.1:4173/ node tests/reviewed-city-ui.mjs
      - name: Save only test reports/screenshots; NEVER a DEV market deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma-xiii-geo-hold-review
          path: |
            roma-xiii-hold-review/summary.json
            roma-xiii-hold-review/roma-xiii-geo-holds.json
            roma-xiii-hold-review/roma-xiii-diff-guard.json
            roma-xiii-hold-review/roma-xiii-static-guard.json
            roma-xiii-hold-review/release-decision.json
            ux-roma-*.png
          retention-days: 30
          if-no-files-found: warn
