# Temporary proof: parser source contracts run without a DEV or PROD market write.
name: Official source contracts — real CSV and full offline Autopilot dry-run

on:
  push:
    branches: [improve/data-quality-security-performance-2026-10-11]
    paths:
      - .github/workflows/source-contracts-full-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run all existing regressions and new declarative-contract tests
        run: python -m unittest discover -s backend/tests -v
      - name: Prove source-level identity, address, hour and weekday parity on SAME official CSV bytes
        run: |
          python - <<'PY'
          import sys,json
          from datetime import date
          from pathlib import Path
          sys.path.insert(0,'backend')
          from source_corciano import fetch_csv,parse_csv as legacy_parser,convert as legacy_converter
          from source_lifecycle import run,markdown
          from source_contract_ingest import stage
          from source_contract_parity import compare,verify
          from merge_catalog import load_existing
          today=date(2026,10,13)
          config=json.loads(Path('backend/data/market-source-contracts.json').read_text('utf-8'))
          profile=next(x for x in config['raw_profiles'] if x['id']=='corciano-generic-shadow')
          old=load_existing(Path('public/data/v1/manifest.json'))
          blob=fetch_csv()  # One original bounded, read-only municipal download
          legacy=legacy_converter(legacy_parser(blob),today)
          parity=compare(profile,blob,legacy,today=today)
          verify(parity,expect_identities=4)
          candidates,stage_report=stage(profile,blob,old,today=today,
                                        observed_source_sha256=parity['source_snapshot_sha256'])
          measured=run(config,old,probe_raw=True,raw_fetch=lambda url:(blob,False),
                       today=today)
          case=measured['sources'].get(profile['id']) or {}
          counts=case.get('counts') or {}
          if (not measured.get('read_only')
              or measured.get('market_imports')!=0
              or measured.get('market_confirmations')!=0
              or measured.get('market_identity_deletions')!=0
              or len(old)<12000
              or measured.get('catalog_count')!=len(old)
              or measured.get('source_checks',{}).get('source_level_raw_profiles_checked')!=1
              or counts.get('rows_observed')!=4
              or stage_report.get('counts',{}).get('source_market_identities')!=4
              or stage_report.get('counts',{}).get('already_in_catalog_exact_source_id')!=2
              or sum(stage_report.get('review_reason_counts',{}).values())!=2
              or candidates
              or stage_report.get('safe_candidates_not_published')!=0
              or case.get('license_reviewed_for_automatic_publication') is not False
              or case.get('individual_market_openings_verified')!=0):
              raise ValueError('Source was not reconciled by stable venue identity and existing overlap evidence')
          root=Path('source-contract-audit');root.mkdir(parents=True,exist_ok=True)
          (root/'source-contract-shadow-parity.json').write_text(
              json.dumps(parity,indent=2,ensure_ascii=False)+'\n','utf-8')
          (root/'source-contract-stage.json').write_text(
              json.dumps(stage_report,indent=2,ensure_ascii=False)+'\n','utf-8')
          (root/'raw-source-lifecycle.json').write_text(
              json.dumps(measured,indent=2,ensure_ascii=False)+'\n','utf-8')
          (root/'RAW_SOURCE_LIFECYCLE.md').write_text(markdown(measured),'utf-8')
          print('SOURCE_CONTRACT_REAL_CSV_PARITY',json.dumps({
              'original_identities':len(legacy),
              'generic_identities':parity['generic_adapter_identities'],
              'safe_source_facts_equal':parity['parity_complete'],
              'existing_ids':2,'known_cross_source_ambiguities':2,
              'proposed_new_market_ids':len(candidates),
              'published_events':0,'new_geocoordinates':0,
              'additional_source_downloads':0
          }))
          PY
      - name: Run the actual Autopilot completely offline and prove ID preservation
        run: |
          python backend/autopilot.py --offline --today 2026-10-13 \
            --output source-contract-audit/autopilot
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('source-contract-audit/autopilot')
          decision=json.loads((root/'release-decision.json').read_text('utf-8'))
          lifecycle=json.loads((root/'source-lifecycle.json').read_text('utf-8'))
          checkpoint=json.loads((root/'checkpoints/source_lifecycle.json').read_text('utf-8'))
          approved=json.loads((root/'generic-source-admissions.json').read_text('utf-8'))
          approved_diff=json.loads((root/'generic-source-admissions-diff-guard.json').read_text('utf-8'))
          approved_final=json.loads((root/'generic-source-admissions-static-guard.json').read_text('utf-8'))
          admission_stage=json.loads((root/'checkpoints/generic_admission.json').read_text('utf-8'))
          final=json.loads((root/'candidate/public/data/v1/manifest.json').read_text('utf-8'))
          prior=json.loads(Path('public/data/v1/manifest.json').read_text('utf-8'))
          if (not decision['approved'] or final['total']!=prior['total']
              or prior['total']<12000
              or lifecycle.get('catalog_count')!=prior['total']
              or lifecycle.get('market_imports')!=0
              or lifecycle.get('market_confirmations')!=0
              or lifecycle.get('market_identity_deletions')!=0
              or checkpoint.get('result',{}).get('enabled') is not True
              or checkpoint.get('result',{}).get('new_markets_imported')!=0
              or checkpoint.get('result',{}).get('event_verifications_created')!=0
              or admission_stage.get('result',{}).get('enabled') is not True
              or approved.get('source_contracts_active')!=0
              or approved.get('new_market_ids')!=[]
              or approved.get('candidate_market_ids')!=prior['total']
              or approved_diff.get('release_safe') is not True
              or approved_final.get('release_safe') is not True
              or approved_final.get('new_source_venue_ids_verified')!=0):
              raise ValueError('Source lifecycle changed public market identities or created false confirmations')
          print('FULL_AUTOPILOT_SOURCE_CONTRACTS_OFFLINE',json.dumps({
            'catalog_ids_kept':final['total'],
            'lifecycle_checkpoint_written':True,
            'source_records_imported_by_quality_audit':0,
            'publisher_outage_causes_market_deletions':False,
            'generic_publisher_release_gate_enabled':True,
            'active_legal_source_admissions':0
          }))
          PY
      - name: Preserve contracts QA reports and checkpoints, never publish market data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-are-repeatable-no-deployment
          retention-days: 30
          if-no-files-found: warn
          path: |
            source-contract-audit/raw-source-lifecycle.json
            source-contract-audit/RAW_SOURCE_LIFECYCLE.md
            source-contract-audit/source-contract-shadow-parity.json
            source-contract-audit/source-contract-stage.json
            source-contract-audit/autopilot/source-lifecycle.json
            source-contract-audit/autopilot/SOURCE_LIFECYCLE.md
            source-contract-audit/autopilot/release-decision.json
            source-contract-audit/autopilot/checkpoints/source_lifecycle.json
            source-contract-audit/autopilot/generic-source-admissions.json
            source-contract-audit/autopilot/generic-source-admissions-diff-guard.json
            source-contract-audit/autopilot/generic-source-admissions-static-guard.json
            source-contract-audit/autopilot/checkpoints/generic_admission.json
