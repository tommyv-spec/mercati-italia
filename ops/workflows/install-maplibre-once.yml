name: Install free map renderer (one-time)
on:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/install-maplibre-once.yml
permissions:
  contents: write
jobs:
  map-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Add MapLibre GL JS with updated lockfile
        run: npm install maplibre-gl@5 --save --no-audit --no-fund
      - name: Verify clean lockfile installation and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Checkpoint new dependency on review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "feat(map): add open-source MapLibre renderer and lock dependencies"
          git push
