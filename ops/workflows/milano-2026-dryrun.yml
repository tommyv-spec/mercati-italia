# Do NOT publish; inspect independently the final artifacts after Milan 2026 proof overlay.
name: Milan October 2026 official schedule — full DEV dry-run (no publication)
on:
  push:
    branches: [improve/data-quality-security-performance-2026-10-11]
    paths:
      - .github/workflows/milano-2026-dryrun.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify all source and schedule regressions
        run: python -m unittest discover -s backend/tests -v
      - name: Reconcile publisher evidence and create only temporary candidate
        run: |
          python - <<'PY'
          import json, sys, shutil
          from datetime import date
          from pathlib import Path
          sys.path.insert(0,'backend')
          from merge_catalog import load_existing
          from milano_2026_overlay import reconcile
          from recurrence_refresh import refresh_records
          from export_static import export
          from validate_static import validate
          base=Path('public/data/v1/manifest.json')
          original=load_existing(base)
          pdf=json.loads(Path('backend/data/milano-mss-oct2026-observations.json').read_text('utf-8'))
          gis=json.loads(Path('backend/data/milano-mss-gis-reviewed.json').read_text('utf-8'))
          now=date(2026,10,12)
          projected, before=refresh_records(original,now,120,540)
          after, report=reconcile(projected,pdf,gis,today=now,apply=True)
          finalized, forecast=refresh_records(after,now,120,540)
          changed=[(a,b) for a,b in zip(original,finalized) if a!=b]
          for a,b in changed:
              if a.get('slug')!=b.get('slug'):raise ValueError('Milan evidence changed identity')
              if a.get('url_fonte')!=b.get('url_fonte'):raise ValueError('Original market URL lost')
              if a.get('verificato_il')!=b.get('verificato_il'):raise ValueError('Invented human verification')
              if a.get('status')!=b.get('status'):raise ValueError('Market status changed')
          out=Path('milan-audit-output')
          dest=out/'candidate/public/data/v1'
          dest.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(base.parent,dest)
          export(finalized,dest,today=now,min_count=12000,max_drop_ratio=.02)
          verified=validate(dest/'manifest.json')
          new=load_existing(dest/'manifest.json')
          old_by={x['slug']:x for x in original}
          new_by={x['slug']:x for x in new}
          if set(old_by)!=set(new_by):raise ValueError('Published market IDs changed')
          altered=[sid for sid in old_by if old_by[sid]!=new_by[sid]]
          new_milan=[sid for sid in altered if sid.startswith('mi-mss-')]
          for sid in new_milan:
              before=old_by[sid]; newer=new_by[sid]
              if any(before.get(k)!=newer.get(k) for k in (
                  'slug','nome','citta','regione','provincia','indirizzo','lat','lng',
                  'position_quality','status','verificato_il','url_fonte','fonte',
                  'orario_testo','categoria')):
                  raise ValueError('Unsafe Milan market field changed: '+sid)
              if newer.get('date_quality')=='confermata':
                  raise ValueError('Forecast falsely confirmed a market')
          summary={
              'schema':1,'review_only':True,
              'records':len(new),'reviewed_milan_ids':report['reconciled_id_count'],
              'milan_records_changed_after_static_export':len(new_milan),
              'milan_card_ids_changed_sample':sorted(new_milan)[:25],
              'milan_predicted_before':sum(bool(x.get('date')) for x in original if x['slug'].startswith('mi-mss-')),
              'milan_predicted_after':sum(bool(x.get('date')) for x in new if x['slug'].startswith('mi-mss-')),
              'new_market_ids':0,'confirmed_dates_added':0,
              'human_verifications_created':0,'published_to_dev':False,
              'publisher_source_report':report,
              'validated':verified,'forecast_summary':forecast,
          }
          if len(new_milan) < 30 or summary['milan_predicted_after'] <= summary['milan_predicted_before']:
              raise ValueError('Milan evidence did not produce expected useful improvements')
          out.mkdir(parents=True,exist_ok=True)
          (out/'integration-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('MILAN_2026_DEV_DRY_RUN',json.dumps({k:summary[k] for k in (
              'records','reviewed_milan_ids','milan_records_changed_after_static_export',
              'milan_predicted_before','milan_predicted_after','new_market_ids',
              'confirmed_dates_added')},ensure_ascii=False))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install approved candidate in ephemeral runner and run static/UI tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          dst=Path('public/data/v1')
          shutil.rmtree(dst)
          shutil.copytree('milan-audit-output/candidate/public/data/v1',dst)
          PY
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node --test tests/*.test.mjs
          npm run build -- --base=./
      - name: Browser mobile read-only, without runtime billed calls
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/milan-dev.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          UI_BASE=http://127.0.0.1:4173/ node tests/ui-smoke.mjs
      - name: Keep evidence and report (never publish market data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milan-oct2026-full-dry-run
          retention-days: 30
          if-no-files-found: warn
          path: |
            milan-audit-output/integration-summary.json
            ux-smoke-result.json
            ux-*.png
