# Run the ACTUAL unattended pipeline in an isolated runner before DEV promotion.
# Never commits market data or touches production.
name: Milan 2026 Autopilot integration — offline source proof (no publish)
on:
  push:
    branches: [improve/data-quality-security-performance-2026-10-11]
    paths:
      - .github/workflows/milano-2026-pipeline-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source-bound schedule tests and all offline regressions
        run: python -m unittest discover -s backend/tests -v
      # The independent proof now also rejects loss of the ORIGINAL Milano
      # municipal source when a newly reviewed PDF link is attached.
      - name: Build entire true Autopilot candidate, offline and no publishing
        run: python backend/autopilot.py --offline --today 2026-10-12 --output milano-pipeline-check
      - name: Independently verify 76 source-backed forecasts and all other market IDs
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'backend')
          from merge_catalog import load_existing
          from milano_2026_overlay import reconcile, PDF_DATE
          from milano_2026_release_guard import verify, verify_exported
          from datetime import date
          root=Path('milano-pipeline-check')
          report=json.loads((root/'milano-2026-review.json').read_text('utf-8'))
          proof=json.loads((root/'milano-2026-diff-guard.json').read_text('utf-8'))
          final=json.loads((root/'milano-2026-static-guard.json').read_text('utf-8'))
          decision=json.loads((root/'release-decision.json').read_text('utf-8'))
          manifest=root/'candidate/public/data/v1/manifest.json'
          base=load_existing(Path('public/data/v1/manifest.json'))
          new=load_existing(manifest)
          old_ids={r['slug'] for r in base}
          new_ids={r['slug'] for r in new}
          if (not decision['approved'] or not final['quality_safe'] or not proof['release_safe']
              or report.get('enabled') is not True
              or final['reviewed_milan_ids']!=76
              or final['forecast_labeled_not_confirmed']!=76
              or len(base)!=len(new) or old_ids != new_ids):
              raise ValueError('Autopilot integration deviates from official two-source proof')
          if any(x.get('date_quality')=='confermata' and not x.get('verificato_il')
                 for x in new):
              raise ValueError('Unproven confirmation in official-source candidate')
          summary={
              'test_date':'2026-10-12',
              'catalog_records':len(new),
              'reviewed_city_milan_forecasts':final['reviewed_milan_ids'],
              'projected_new_milan_occurrence_cards':final['forecast_labeled_not_confirmed'],
              'primary_sources_preserved':final['preserved_original_sources'],
              'new_ids':len(new_ids-old_ids),
              'removed_ids':len(old_ids-new_ids),
              'human_confirmations_added':0,
              'release_approved_for_test_only':True,
              'published':False,
          }
          print('FULL_MILAN_AUTOPILOT_AUDIT',json.dumps(summary))
          (root/'milano-full-autopilot-summary.json').write_text(
              json.dumps(summary,indent=2)+'\n','utf-8')
          PY
      - name: Preserve proof and quality checkpoints; never publish candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milano-2026-true-autopilot-rehearsal
          path: |
            milano-pipeline-check/status.json
            milano-pipeline-check/release-decision.json
            milano-pipeline-check/milano-2026-review.json
            milano-pipeline-check/milano-2026-diff-guard.json
            milano-pipeline-check/milano-2026-static-guard.json
            milano-pipeline-check/milano-full-autopilot-summary.json
            milano-pipeline-check/checkpoints/
          retention-days: 30
          if-no-files-found: warn
