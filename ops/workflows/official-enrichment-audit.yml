# Historical, read-only audit before enabling official-source enrichment.
# Manual only; inapplicable when enrichment is already enabled in the policy.
# Do not publish to DEV/main or live. Only exact venue/day and compatible geo.
name: Official source enrichment — full dry-run (no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-enrichment-full-dry-run
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate adapters and source reconciliation offline
        run: python -m unittest discover -s backend/tests -v
      - name: Create ephemeral strictly opt-in policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('backend/autopilot_policy.json').read_text())
          if p.get('enrichment',{}).get('enabled'):
              raise ValueError('Enrichment already deployed: do not run candidate-only audit')
          p['enrichment']={'enabled':True,'source':'lombardia-mercap'}
          Path('/tmp/official-enrichment-test-policy.json').write_text(json.dumps(p))
          PY
      - name: Fetch real Lombardia/Corciano sources once and enrich only overlapping legacy rows
        run: |
          set -euo pipefail
          python backend/autopilot.py \
            --policy /tmp/official-enrichment-test-policy.json \
            --output official-enrichment-audit
      - name: Quantify observed official hours and zero invented verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'backend')
          from merge_catalog import load_existing
          from validate_static import validate
          from audit_dataset import audit

          output=Path('official-enrichment-audit')
          before=load_existing(Path('public/data/v1/manifest.json'))
          manifest=output/'candidate/public/data/v1/manifest.json'
          validate(manifest)
          after=load_existing(manifest)
          old={r['slug']:r for r in before}
          new={r['slug']:r for r in after}
          report=json.loads((output/'official-enrichment.json').read_text())
          decision=json.loads((output/'release-decision.json').read_text())
          hours_changed=[
            (slug,old[slug],new[slug]) for slug in old
            if not old[slug].get('orario_testo') and new[slug].get('orario_testo')
          ]
          mismatch=[
            slug for slug in old
            if (old[slug].get('verificato_il')!=new[slug].get('verificato_il')
                or old[slug].get('date_quality')!=new[slug].get('date_quality')
                or old[slug].get('lat')!=new[slug].get('lat')
                or old[slug].get('lng')!=new[slug].get('lng')
                or old[slug].get('url_fonte')!=new[slug].get('url_fonte')
                or old[slug].get('aggiornato_il')!=new[slug].get('aggiornato_il'))
          ]
          originalHoursMissing=sum(not r.get('orario_testo') for r in before)
          newHoursMissing=sum(not r.get('orario_testo') for r in after)
          currentManifest=json.loads(manifest.read_text())
          beforeManifest=json.loads(Path('public/data/v1/manifest.json').read_text())
          stats={
            'decision_approved':decision['approved'],
            'base_records':len(before),
            'candidate_records':len(after),
            'retained_all_old_ids':set(old).issubset(new),
            'hours_added_existing':len(hours_changed),
            'hours_source_reported':report['existing_market_hours_added'],
            'official_links_added':report['official_source_attributions_added'],
            'official_records_screened':report['source_rows_screened'],
            'exact_location_day_matches':report['exact_matches'],
            'suspicious_evidence_changes':mismatch[:20],
            'missing_hours_before':originalHoursMissing,
            'missing_hours_after':newHoursMissing,
            'index_bytes_before':audit(Path('public/data/v1/manifest.json'))['sizes']['national_index_gzip_bytes'],
            'index_bytes_after':audit(manifest)['sizes']['national_index_gzip_bytes'],
            'sample_albizzate':[{
                'slug':slug,'source_hour':current['orario_testo'],
                'orig_hour':prior.get('orario_testo'),
                'verified':bool(current.get('verificato_il')),
                'sources':[x.get('url') for x in current.get('fonti',[])]
            } for slug,prior,current in hours_changed if prior.get('citta')=='Albizzate'][:3],
            'approval_gates':decision['gates']
          }
          assert decision['approved'] and report['enabled'] is True
          assert len(before)==len(after), 'No new identities belong to enrichment-only stage'
          assert stats['retained_all_old_ids']
          assert report['existing_market_hours_added']>=20, (
              'Insufficient source-backed hours: inspect schema / overlap'
          )
          assert len(hours_changed)==report['existing_market_hours_added']
          assert not mismatch, 'Enrichment changed market identity/date/position/verification'
          assert len(hours_changed)==originalHoursMissing-newHoursMissing
          assert len(report['samples'])>0
          assert report['individual_market_verifications']==0
          assert report['record_identity_changes']==0
          assert report['coordinates_overwritten']==0
          assert report['primary_sources_overwritten']==0
          assert report['old_dataset_dates_overwritten']==0
          # Every newly enriched published market has source URL evidence,
          # never just an hour without provenance.
          assert all(
              'https://www.dati.lombardia.it/d/68zx-njaw' in
              [x.get('url') for x in row.get('fonti',[])]
              for _,_,row in hours_changed
          ), 'Official hours missing publisher link'
          assert stats['sample_albizzate'], 'Observed manual Albizzate case not reproducible'
          output.joinpath('integration-summary.json').write_text(
              json.dumps(stats,indent=2,ensure_ascii=False)+'\n')
          print('OFFICIAL_ENRICHMENT_SUMMARY',json.dumps(stats,ensure_ascii=False))
          PY
      - name: Temporarily test candidate data in site without publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          dst=Path('public/data/v1')
          shutil.rmtree(dst)
          shutil.copytree(Path('official-enrichment-audit/candidate/public/data/v1'),dst)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate frontend static costs and compile
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node --test tests/*.test.mjs
          npm run build -- --base=./
      - name: Full mobile interaction smoke on actual enriched candidate
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/enrichment-preview.log 2>&1 &
          for n in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          UI_BASE=http://127.0.0.1:4173/ node tests/ui-smoke.mjs
      - name: Save verified QA and checkpoint report, never publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-enrichment-audit
          retention-days: 30
          if-no-files-found: warn
          path: |
            official-enrichment-audit/checkpoints/
            official-enrichment-audit/release-decision.json
            official-enrichment-audit/official-enrichment.json
            official-enrichment-audit/OFFICIAL_ENRICHMENT.md
            official-enrichment-audit/integration-summary.json
            ux-smoke-result.json
            ux-*.png
