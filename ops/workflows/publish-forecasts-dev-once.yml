name: DEV only — publish renewed predicted dates once
on:
  push:
    branches:
      - improve/data-quality-security-performance-2026-10-11
    paths:
      - .github/workflows/publish-forecasts-dev-once.yml

permissions:
  contents: write

concurrency:
  group: guarded-forecast-dev-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test recurrence, source merge and existing static integrity
        run: |
          python -m unittest discover -s backend/tests -v
          python backend/validate_static.py --manifest public/data/v1/manifest.json
      - name: Copy complete rollback snapshot BEFORE any change
        run: tar -czf /tmp/mercati-forecast-rollback.tgz public/data/v1
      - name: Keep recoverable signed source baseline
        uses: actions/upload-artifact@v4
        with:
          name: forecast-before-publish
          path: /tmp/mercati-forecast-rollback.tgz
          retention-days: 30
      - name: Read current 12k static records without network/Firebase/Cloudflare
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'backend')
          from merge_catalog import load_existing
          records=load_existing(Path('public/data/v1/manifest.json'))
          Path('/tmp/forecast-original.json').write_text(
              json.dumps(records, ensure_ascii=False),encoding='utf-8')
          print('BEFORE_MARKETS',len(records))
          PY
      - name: Project ONLY explicit weekly/monthly recurrence dates
        run: |
          python backend/recurrence_refresh.py \
            --input /tmp/forecast-original.json \
            --out /tmp/forecast-updated.json \
            --report /tmp/forecast-impact.json \
            --horizon-days 120 --max-stale-days 540
      - name: Save hashed shards, index and manifest with strict drop guards
        run: |
          python backend/export_static.py \
            --input /tmp/forecast-updated.json --min-count 12000 \
            --max-drop-ratio 0.02
          python backend/validate_static.py --manifest public/data/v1/manifest.json
      - name: Prove date coverage, immutability and transfer-budget
        run: |
          python backend/audit_dataset.py --out /tmp/forecast-quality.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          index=json.loads(Path('public/data/v1/manifest.json').read_text())
          quality=json.loads(Path('/tmp/forecast-quality.json').read_text())
          forecast=json.loads(Path('/tmp/forecast-impact.json').read_text())
          after=int(quality['compact_index_future_coverage']['60'])
          if index['index_schema'] != 5 or index['total'] != 12650:
              raise ValueError('Existing 12,650 source IDs or index schema changed')
          if after < 10000:
              raise ValueError('Insufficient source-bound forecasts at 60 days')
          if quality['sizes']['national_index_gzip_bytes'] > 550000:
              raise ValueError('Mobile payload >550KB gzip budget')
          if forecast['reasons'].get('renewed',0) < 10000:
              raise ValueError('Too few confident recurring source rules')
          if not forecast['all_dates_marked_forecast'] or forecast['output_records'] != 12650:
              raise ValueError('Invalid predicted-date provenance')
          print('DEV_FORECAST_PUBLISH_GATES_OK',json.dumps({
              'records':index['total'],
              'next_60d':after,
              'newly_dated':forecast['newly_dated'],
              'recurrences':forecast['reasons']['renewed'],
              'index_gzip':quality['sizes']['national_index_gzip_bytes'],
          },ensure_ascii=False))
          PY
      - name: Keep date-forecast quality report and outcome
        uses: actions/upload-artifact@v4
        with:
          name: forecast-after-publish
          path: |
            /tmp/forecast-impact.json
            /tmp/forecast-quality.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit DEV branch ONLY (no production merge/deploy)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/v1
          if git diff --cached --quiet; then
            echo "Already renewed, no change."
            exit 0
          fi
          git commit -m "data: roll unconfirmed recurring dates forward in DEV"
          for retry in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort || true
              echo "::error::Overlapping snapshot edits. No force push."
              exit 1
            }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
