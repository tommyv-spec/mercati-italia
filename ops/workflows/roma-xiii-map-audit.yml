# Municipality XIII place list is from a dated 2024 map. It is NOT current event confirmation.
name: Roma Municipio XIII municipal market map — safe comparison (no import)
on:
  push:
    branches: [improve/data-quality-security-performance-2026-10-11]
    paths:
      - .github/workflows/roma-xiii-map-audit.yml
  workflow_dispatch:

concurrency:
  group: roma-xiii-market-data-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin code and verify all records/regressions
        run: |
          mkdir -p roma-review
          git rev-parse HEAD > roma-review/dev-source-sha.txt
          python -m unittest discover -s backend/tests -v
      - name: Read-only compare municipal map to complete public catalog
        run: |
          python backend/roma_xiii_map_audit.py \
            --manifest public/data/v1/manifest.json \
            --out roma-review/roma-xiii-map-audit.json \
            --report roma-review/ROMA_XIII_MAP_AUDIT.md
      - name: Prove the map did not create any market or navigation route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('roma-review/roma-xiii-map-audit.json').read_text('utf-8'))
          m=json.loads(Path('public/data/v1/manifest.json').read_text('utf-8'))
          if (a.get('schema')!=1 or a.get('role')!='municipal_map_place_matching_only'
              or a.get('review_only') is not True or
              a.get('municipal_map_markers')!=9 or
              a.get('original_market_ids_preserved')!=m['total'] or
              a.get('source_market_ids_published')!=0 or
              a.get('market_cards_modified')!=0 or
              a.get('future_events_confirmed')!=0 or
              a.get('road_directions_enabled')!=0 or
              a.get('data_license_cleared_automatically') is not False):
              raise ValueError('Roma XIII public source review attempted an unauthorized import')
          observations=a.get('observations',[])
          montes=[x for x in observations if x.get('market_name')=='MONTESPACCATO']
          if len(montes)!=2 or montes[0]['source_street']==montes[1]['source_street']:
              raise ValueError('Two different Montespaccato market locations were confused')
          print('ROME_XIII_SAFE_SOURCE_LEADS',json.dumps({
              'markers':9,'rome_cards_compared':a['rome_catalog_cards'],
              'review_buckets':a['counts'],'new_market_records':0
          }))
          PY
          cat roma-review/ROMA_XIII_MAP_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep source evidence and tested report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma-xiii-market-source-review
          path: roma-review/
          retention-days: 30
          if-no-files-found: warn

  save_report:
    needs: compare
    if: needs.compare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/data-quality-security-performance-2026-10-11
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: roma-xiii-market-source-review
          path: roma-review
      - name: Only save reports on unchanged DEV revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat roma-review/dev-source-sha.txt)" = "$(git rev-parse HEAD)"
          mkdir -p reports/automation
          for item in roma-xiii-map-audit.json ROMA_XIII_MAP_AUDIT.md; do
            test -s "roma-review/$item"
            cp "roma-review/$item" "reports/automation/$item"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/automation/roma-xiii-map-audit.json reports/automation/ROMA_XIII_MAP_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "audit: compare Roma XIII official map against catalog (no publication)"
            git push origin HEAD:improve/data-quality-security-performance-2026-10-11
          fi
